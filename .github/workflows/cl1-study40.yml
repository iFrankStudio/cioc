name: CL-1 Study40 retrospective native W3 activity audit

on:
  push:
    paths:
      - 'cl1/analyze_study40.py'
      - 'cl1/tests/test_study40.py'
      - '.github/workflows/cl1-study40.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  study40:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify documented post-result registration and targeted synthetic attribution
        run: |
          set -euo pipefail
          test -f cl1/studies/40-registered-retrospective-w3-functional-activity.md
          python3 -m unittest discover -s cl1/tests -p 'test_study40.py' -v
      - name: Fetch exact original completed source-pinned Study38 and Study39 SQLite archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/study40/38" "$RUNNER_TEMP/study40/39"
          gh run download 43551254964 --repo "$GITHUB_REPOSITORY" --name cl1-study38-ambient-neutral-ignition --dir "$RUNNER_TEMP/study40/38"
          gh run download 43551653280 --repo "$GITHUB_REPOSITORY" --name cl1-study39-ambient-neutral-ignition --dir "$RUNNER_TEMP/study40/39"
          test -s "$RUNNER_TEMP/study40/38/cl1-study38.sqlite"
          test -s "$RUNNER_TEMP/study40/39/cl1-study39.sqlite"
      - name: Independently recheck original audits and 61440 hashed snapshots for W3 native success
        run: |
          set -euo pipefail
          python3 cl1/analyze_study40.py "$RUNNER_TEMP/study40/38/cl1-study38.sqlite" "$RUNNER_TEMP/study40/39/cl1-study39.sqlite" --json "$RUNNER_TEMP/study40-report.json"
          python3 - "$RUNNER_TEMP/study40-report.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          print(json.dumps({
            "study":d["study"],
            "new_worlds":d["new_independent_worlds"],
            "snapshots":d["verified_epoch_sha256_snapshots"],
            "study38":{k:v for k,v in d["separate_cohorts"]["38"]["metrics"].items() if k.startswith("ambient-general.")},
            "study39":{k:v for k,v in d["separate_cohorts"]["39"]["metrics"].items() if k.startswith("ambient-general.")},
            "life_claim":d["life_claim"],
          },indent=2))
          PY
      - name: Archive concise retrospective audit without duplicating historical SQLite
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cl1-study40-retrospective-success-vs-starter
          retention-days: 30
          path: ${{ runner.temp }}/study40-report.json
