name: CL-1 Study66 stochastic native sensor-feedback and compute coupling

on:
  push:
    paths:
      - 'cl0/crates/lab/src/bin/cl1-study66.rs'
      - 'cl1/analyze_study66.py'
      - 'cl1/tests/test_study66.py'
      - '.github/workflows/cl1-study66.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  study66:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: cl0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify strictly earlier Study66 registration and frozen native energy and source gate
        run: |
          set -euo pipefail
          test -s ../cl1/studies/66-preregistered-stochastic-feedback-native-energy-coupling.md
      - name: Rust strict format/tests/clippy and two targeted independently causal calibration cases
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo test --locked --workspace
          cargo clippy --locked --workspace --all-targets -- -D warnings
          python3 -m unittest discover -s ../cl1/tests -p 'test_study66.py' -v
      - name: Generate and exact replay 256 independent native source-energy random genomes under 8 matched conditions
        run: |
          set -euo pipefail
          CL1_SOURCE_REVISION="$GITHUB_SHA" cargo run --locked --quiet -p cl0-lab --bin cl1-study66 -- "$RUNNER_TEMP/cl1-study66-feedback-energy-ecology.sqlite"
      - name: Independently reconstruct all programs, 49152 hashed epochs and registered native Draw/Read/Write ledgers
        run: |
          set -euo pipefail
          python3 ../cl1/analyze_study66.py "$RUNNER_TEMP/cl1-study66-feedback-energy-ecology.sqlite" --expected-revision "$GITHUB_SHA" --json "$RUNNER_TEMP/cl1-study66-report.json"
          python3 - "$RUNNER_TEMP/cl1-study66-report.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          print(json.dumps({
            "original_genomes":r["new_independent_seed_genomes"],
            "original_native_runs":r["matched_native_runs"],
            "hashes":r["SHA256_verified_original_snapshots"],
            "coupled_primary":r["primary_A_coupled_random_native_read_write_and_DrawCompute"],
            "strict_resource_renewal":r["secondary_B_recurrent_W2_W3_native_Draw_and_feedback"],
            "life_claim":r["life_claim"],
          },indent=2))
          PY
      - name: Archive original native SQLite source-pinned cohort and independent causal energy/feedback audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cl1-study66-native-feedback-energy
          retention-days: 30
          path: |
            ${{ runner.temp }}/cl1-study66-feedback-energy-ecology.sqlite
            ${{ runner.temp }}/cl1-study66-report.json
