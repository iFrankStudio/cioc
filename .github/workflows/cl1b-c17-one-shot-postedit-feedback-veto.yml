name: CL-1B C17 original paid one-shot postedit feedback probe and veto

on:
  push:
    branches: [main]
    paths:
      - 'cl1b/studies/CL1B-C17-ONE-SHOT-PAID-POSTEDIT-FEEDBACK-VETO-frozen-274-worlds-v1.json'
      - 'cl1b/studies/CL1B-C17-ONE-SHOT-PAID-POSTEDIT-FEEDBACK-VETO-preregistration.md'
      - 'cl0/crates/world/tests/cl1b_c17_paid_postedit_feedback_veto.rs'
      - 'cl1b/audits/cl1b_c17_paid_postedit_feedback_veto_independent_replay.py'
      - '.github/workflows/cl1b-c17-one-shot-postedit-feedback-veto.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cl1b-c17-original-paid-postedit-veto
  cancel-in-progress: true

jobs:
  native-and-independent-274-paid-worlds:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: cl0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cl0
      - name: Run native original 274 PID1 private-fee worlds with actual PC5 self-modification and one feedback probe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cl1b-ci-evidence
          cargo test --locked -p cl0-world --test cl1b_c17_paid_postedit_feedback_veto -- --nocapture \
            2>&1 | tee cl1b-ci-evidence/cl1b-c17-original-native.log
      - name: Independently replay full charged CIL, actual own code edge changes, and true or false feedback
        shell: bash
        run: |
          set -euo pipefail
          python3 ../cl1b/audits/cl1b_c17_paid_postedit_feedback_veto_independent_replay.py \
            cl1b-ci-evidence/cl1b_c17_original_native_274_worlds.json cl1b-ci-evidence \
            > cl1b-ci-evidence/cl1b_c17_independent_replay.json
          python3 - <<'PY'
          import json
          d=json.load(open('cl1b-ci-evidence/cl1b_c17_independent_replay.json'))
          assert d['first_divergence'] is None
          assert d['native_worlds']==274 and d['new_goal_schedules']==45
          print('Original independent C17 paid self-patching and post-edit feedback veto parity:',d)
          PY
      - name: Record exact original tested SHA, real run ID, and scope
        if: always()
        shell: bash
        run: |
          mkdir -p cl1b-ci-evidence
          {
            echo "repository=iFrankStudio/cioc"
            echo "tested_sha=$GITHUB_SHA"
            echo "run_id=$GITHUB_RUN_ID"
            echo "attempt=$GITHUB_RUN_ATTEMPT"
            echo "scope=C17_274_original_native_one_PID1_216_node_paid_self_patched_PC5_feedback_17_data_cells"
          } > cl1b-ci-evidence/cl1b-c17-original-provenance.txt
      - name: Preserve original worlds and negative results even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cl1b-c17-original-native-paid-selfpatch-feedback-veto-274
          path: cl0/cl1b-ci-evidence/
          if-no-files-found: warn
