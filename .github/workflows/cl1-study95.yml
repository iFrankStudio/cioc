name: CL-1 Study95 original source-function host restoration dynamical access diagnosis

on:
  push:
    paths:
      - 'cl1/analyze_study95.py'
      - 'cl1/studies/95-retrospective-source-writer-host-rescue-dynamical-access.md'
      - '.github/workflows/cl1-study95.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  statuses: write

jobs:
  original-code-restored-dynamics:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: cl0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify retrospective registration and original independent lineage sources
        run: |
          set -euo pipefail
          test -s ../cl1/studies/95-retrospective-source-writer-host-rescue-dynamical-access.md
          test -s ../cl1/analyze_study94.py
          test -s ../cl1/analyze_study82.py
      - name: Recover untouched original Study94 512-genotype SQLite archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/study95"
          gh run download 43599692512 --repo "$GITHUB_REPOSITORY" --name cl1-study94-original-native-functional-lesion --dir "$RUNNER_TEMP/study95"
          test -s "$RUNNER_TEMP/study95/cl1-study94-original-prefork-native-lesions.sqlite"
      - name: Independently revalidate 110592 original SHA256 snapshots and distinguish repaired edge from native access to function
        run: |
          set -euo pipefail
          python3 ../cl1/analyze_study95.py "$RUNNER_TEMP/study95/cl1-study94-original-prefork-native-lesions.sqlite" --json "$RUNNER_TEMP/study95-host-code-restoration-route.json"
      - name: Archive retrospective actor-PC and source-def-use diagnosis only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cl1-study95-retrospective-source-writer-host-restoration
          retention-days: 30
          path: ${{ runner.temp }}/study95-host-code-restoration-route.json
      - name: Publish exact-source Study95 original-only audit outcome
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_CONCLUSION: ${{ job.status }}
        run: |
          set -euo pipefail
          if [ "$JOB_CONCLUSION" = success ]; then state=success; else state=failure; fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context="cl1/study95-original-host-route-diagnosis" \
            -f description="Retrospective 110592 original hashes; host code restoration and actor route: $state" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
