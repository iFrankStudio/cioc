name: CL-1B preserve verified C14b original native evidence

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cl1b-c14b-preserve-original-evidence.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: cl1b-c14b-permanent-native-evidence
  cancel-in-progress: false

jobs:
  preserve-verified-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
      - name: Download and check original-success C14b artifact, exact byte hash and 274 traces
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/cl1b-c14b-preserve
          curl --fail --location --retry 3 --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/iFrankStudio/cioc/actions/artifacts/14788592048/zip" \
            -o /tmp/cl1b-c14b-preserve/original-native.zip
          echo 'd35dfa5dd01bb0d0443a839ebbd35c99d29458ee9acac6c2ff740ebe0e60e941  /tmp/cl1b-c14b-preserve/original-native.zip' | sha256sum -c -
          python3 - <<'PY'
          import json,zipfile
          p='/tmp/cl1b-c14b-preserve/original-native.zip'
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              names=z.namelist()
              assert len(names)==len(set(names))==278,len(names)
              assert sum(n.endswith('.jsonl') for n in names)==274
              d=json.loads(z.read('cl1b_c14b_original_native_274_worlds.json'))
              a=json.loads(z.read('cl1b_c14b_independent_replay.json'))
              assert d['study']=='CL1B-C14B-PAID-WRITER-VERIFIED-SUCCESS-SOURCE-RESTORATION'
              assert d['native_worlds']==274 and len(d['records'])==45
              assert d['total_paid_cil']==a['exact_private_paid_cil_replayed']==1050989
              assert a['first_divergence'] is None and a['native_worlds']==274
              assert d['main_actor_paid_success_records']==0
              assert d['main_actual_physical_pc173_restores']==5
              assert sum(r['arms'][0]['skipped_unverified_positive'] for r in d['records'])==2160
              assert d['arm_fees']['truth_success_restore']==182315
              prov=z.read('cl1b-c14b-original-provenance.txt').decode()
              assert 'tested_sha=2ecf5fd5510d6a0564c8cf4eba81f37c637f8bf3' in prov
              assert 'run_id=45108367499' in prov
              print('C14b provenance-OFF ZIP PASS: 278 members/274 original traces, independent CIL; zero verifiable records')
          PY
      - name: Preserve binary original at immutable run-record path on evidence branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin cl1b-ci-evidence
          git checkout -B cl1b-ci-evidence origin/cl1b-ci-evidence
          dest='run-records/2ecf5fd5510d6a0564c8cf4eba81f37c637f8bf3-45108367499-1'
          mkdir -p "$dest"
          cp /tmp/cl1b-c14b-preserve/original-native.zip "$dest/original-native-artifact.zip"
          echo 'd35dfa5dd01bb0d0443a839ebbd35c99d29458ee9acac6c2ff740ebe0e60e941  original-native-artifact.zip' > "$dest/original-native-artifact.sha256"
          git add "$dest/original-native-artifact.zip" "$dest/original-native-artifact.sha256"
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'evidence(cl1b): preserve C14b original 274-world paid meter native archive'
            git push origin HEAD:cl1b-ci-evidence
          else
            echo 'Identical C14b bytes already recorded'
          fi
      - name: Fetch back Git archive bytes and repeat independent hash check
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin cl1b-ci-evidence
          dest='run-records/2ecf5fd5510d6a0564c8cf4eba81f37c637f8bf3-45108367499-1'
          git show "origin/cl1b-ci-evidence:$dest/original-native-artifact.zip" | sha256sum | grep -F 'd35dfa5dd01bb0d0443a839ebbd35c99d29458ee9acac6c2ff740ebe0e60e941'
          git show "origin/cl1b-ci-evidence:$dest/original-native-artifact.sha256" | grep -F 'd35dfa5dd01bb0d0443a839ebbd35c99d29458ee9acac6c2ff740ebe0e60e941'
          echo 'C14b independently fetched permanent Git original binary: exact SHA-256 verified'
