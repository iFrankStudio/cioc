name: CL-1 Study92 original detour mechanism dropout and native edit access audit

on:
  push:
    paths:
      - 'cl1/analyze_study92.py'
      - 'cl1/studies/92-retrospective-detour-sham-dropout-and-edit-access.md'
      - '.github/workflows/cl1-study92.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  statuses: write

jobs:
  original-only-native-path-diagnosis:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: cl0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify retrospective protocol and original lineage-analysis sources
        run: |
          set -euo pipefail
          test -s ../cl1/studies/92-retrospective-detour-sham-dropout-and-edit-access.md
          test -s ../cl1/analyze_study91.py
          test -s ../cl1/analyze_study82.py
      - name: Retrieve the exact original untouched Study91 native SQLite and independent result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/study92"
          gh run download 43598229363 --repo "$GITHUB_REPOSITORY" --name cl1-study91-original-native-functional-lesion --dir "$RUNNER_TEMP/study92"
          test -s "$RUNNER_TEMP/study92/cl1-study91-original-prefork-native-lesions.sqlite"
      - name: Independently reverify original 27648 hashes and inspect native repair reachability vs sham functionality
        run: |
          set -euo pipefail
          python3 ../cl1/analyze_study92.py "$RUNNER_TEMP/study92/cl1-study91-original-prefork-native-lesions.sqlite" --json "$RUNNER_TEMP/study92-retrospective-repair-path.json"
      - name: Archive retrospective diagnosis only, not duplicate original SQLite
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cl1-study92-retrospective-original-native-repair-path-diagnosis
          retention-days: 30
          path: ${{ runner.temp }}/study92-retrospective-repair-path.json
      - name: Post exact-source retrospective audit conclusion
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_CONCLUSION: ${{ job.status }}
        run: |
          set -euo pipefail
          if [ "$JOB_CONCLUSION" = success ]; then state=success; else state=failure; fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context="cl1/study92-native-repair-path-retrospective" \
            -f description="Source-pinned original Study91 sham versus detour repair opportunity: $state" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
