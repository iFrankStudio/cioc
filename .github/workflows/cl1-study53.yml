name: CL-1 Study53 paired CIL source register alias trial

on:
  push:
    paths:
      - 'cl0/crates/lab/src/bin/cl1-study53-alias.rs'
      - 'cl0/crates/lab/src/bin/cl1-study53-separate.rs'
      - 'cl1/analyze_study53_alias.py'
      - 'cl1/analyze_study53_separate.py'
      - 'cl1/analyze_study53.py'
      - 'cl1/tests/test_study53.py'
      - '.github/workflows/cl1-study53.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  study53:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    defaults:
      run:
        working-directory: cl0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enforce earlier independent preregistration
        run: |
          test -f ../cl1/studies/53-preregistered-graph-register-alias-causal-trial.md
      - name: Verify strict Rust world and minimal independent topology controls
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo test --locked --workspace
          cargo clippy --locked --workspace --all-targets -- -D warnings
          python3 -m unittest discover -s ../cl1/tests -p 'test_study53.py' -v
      - name: Run source/result aliased original native program regime and full SQLite replay
        run: |
          set -euo pipefail
          CL1_SOURCE_REVISION="$GITHUB_SHA" cargo run --locked --quiet -p cl0-lab --bin cl1-study53-alias -- "$RUNNER_TEMP/cl1-study53-alias.sqlite"
      - name: Run separate graph-source and local-node-result register regime on same frozen seeds
        run: |
          set -euo pipefail
          CL1_SOURCE_REVISION="$GITHUB_SHA" cargo run --locked --quiet -p cl0-lab --bin cl1-study53-separate -- "$RUNNER_TEMP/cl1-study53-separate.sqlite"
      - name: Audit 24576 source-pinned epochs and the causal original Write source/opcode contrast
        run: |
          set -euo pipefail
          python3 ../cl1/analyze_study53.py "$RUNNER_TEMP/cl1-study53-alias.sqlite" "$RUNNER_TEMP/cl1-study53-separate.sqlite" --expected-revision "$GITHUB_SHA" --json "$RUNNER_TEMP/cl1-study53-report.json"
          python3 - "$RUNNER_TEMP/cl1-study53-report.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          print(json.dumps({
            "study":d["study"],
            "original_seed_pairs":d["independent_seed_pairs"],
            "original_SHA256_epochs":d["SHA256_verified_original_epochs"],
            "primary_A":d["primary_A_initial_Write_source_in_strict_assembly"],
            "primary_B":d["primary_B_functional_native_child"],
            "life_claim":d["life_claim"],
          },indent=2))
          PY
      - name: Archive both untouched native regime SQLite databases and independent causal result
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cl1-study53-paired-graph-register-alias
          retention-days: 30
          path: |
            ${{ runner.temp }}/cl1-study53-alias.sqlite
            ${{ runner.temp }}/cl1-study53-separate.sqlite
            ${{ runner.temp }}/cl1-study53-report.json
