name: CIOC benchmark
on:
  push:
    paths:
      - 'experiments/**'
      - '.github/workflows/benchmark.yml'
  pull_request:
    paths:
      - 'experiments/**'
      - '.github/workflows/benchmark.yml'
  workflow_dispatch:
jobs:
  benchmark:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ['v0.7', 'v0.8', 'v0.9', 'v0.10', 'v0.11', 'v0.12', 'v0.13', 'v0.14', 'v0.15', 'v0.16']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run focused benchmark tests
        run: cd experiments/${{ matrix.version }} && python -m unittest -v
      - name: Reproduce experiment result files
        if: ${{ contains(fromJSON('["v0.13","v0.14","v0.15","v0.16"]'), matrix.version) }}
        run: |
          cd experiments/${{ matrix.version }}
          python run.py
          git diff --exit-code -- results/experiments.json
      - name: Reproduce matched-seed study
        if: ${{ matrix.version == 'v0.14' || matrix.version == 'v0.15' }}
        run: |
          cd experiments/${{ matrix.version }}
          python multiseed.py
          git diff --exit-code -- results/multiseed.json
