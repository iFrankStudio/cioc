name: CIOC benchmark
on:
  push:
  pull_request:
jobs:
  benchmark:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: ['v0.7', 'v0.8', 'v0.9', 'v0.10']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run focused benchmark tests
        run: cd experiments/${{ matrix.version }} && python -m unittest -v
