name: CL-1 Study48 retrospective native graph assembly chronology

on:
  push:
    paths:
      - 'cl1/analyze_study48.py'
      - 'cl1/tests/test_study48.py'
      - '.github/workflows/cl1-study48.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify post-result study registration and native causal path controls
        run: |
          set -euo pipefail
          test -f cl1/studies/48-registered-retrospective-native-graph-assembly-path.md
          python3 -m unittest discover -s cl1/tests -p 'test_study48.py' -v
      - name: Download unchanged original source-pinned Study44 and Study46 archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/study48/44" "$RUNNER_TEMP/study48/46"
          gh run download 43554614365 --repo "$GITHUB_REPOSITORY" --name cl1-study44-native-code-plasticity --dir "$RUNNER_TEMP/study48/44"
          gh run download 43555307061 --repo "$GITHUB_REPOSITORY" --name cl1-study46-native-code-plasticity --dir "$RUNNER_TEMP/study48/46"
          test -s "$RUNNER_TEMP/study48/44/cl1-study44.sqlite"
          test -s "$RUNNER_TEMP/study48/46/cl1-study46.sqlite"
      - name: Independently recheck 24576 original SHA256 hashes and graph copy edit launch
        run: |
          set -euo pipefail
          python3 cl1/analyze_study48.py "$RUNNER_TEMP/study48/44/cl1-study44.sqlite" "$RUNNER_TEMP/study48/46/cl1-study46.sqlite" --json "$RUNNER_TEMP/study48-report.json"
          python3 - "$RUNNER_TEMP/study48-report.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          print(json.dumps({
            "study":r["study"],
            "new_worlds":r["new_independent_worlds"],
            "snapshot_count":r["original_epoch_sha256_verified"],
            "study44":{k:v for k,v in r["cohorts"]["44"]["stage_counts_by_arm"].items() if k.startswith("ambient-general.")},
            "study46":{k:v for k,v in r["cohorts"]["46"]["stage_counts_by_arm"].items() if k.startswith("ambient-general.")},
            "life_claim":r["life_claim"],
          },indent=2))
          PY
      - name: Archive retrospective causal-chain audit without duplicate SQLite
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cl1-study48-retrospective-graph-assembly
          retention-days: 30
          path: ${{ runner.temp }}/study48-report.json
