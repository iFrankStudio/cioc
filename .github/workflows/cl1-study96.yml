name: CL-1 Study96 native source-responsive graph child mechanism feasibility

on:
  push:
    paths:
      - 'cl0/crates/world/tests/study96_functional_native_child_assembly.rs'
      - 'cl1/studies/96-phase0-native-functional-child-code-assembly-calibration.md'
      - '.github/workflows/cl1-study96.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  source-bearing-functional-child:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: cl0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Require zero-ecological-genome mechanism preregistration
        run: |
          set -euo pipefail
          test -s ../cl1/studies/96-phase0-native-functional-child-code-assembly-calibration.md
      - name: Verify generic native graph builder assembles repeatedly functional source-bearing child and exact negative controls
        run: |
          set -euo pipefail
          cargo test --locked -p cl0-world --test study96_functional_native_child_assembly -- --nocapture
      - name: Post exact CIL-source targeted calibration CI conclusion
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_CONCLUSION: ${{ job.status }}
        run: |
          set -euo pipefail
          if [ "$JOB_CONCLUSION" = success ]; then state=success; else state=failure; fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context="cl1/study96-native-functional-child-calibration" \
            -f description="Zero-genome native source-dependent child constructor: $state" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
