name: CL-0 Rust kernel
on:
  push:
    paths:
      - 'cl0/**'
      - '.github/workflows/cl0.yml'
  workflow_dispatch:

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cl0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Format and compile
        run: cargo fmt --all
      - name: Rust kernel and laboratory tests
        run: cargo test --locked --workspace
      - name: Strict Rust lint
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Independent Python analysis unit tests
        run: python3 -m unittest discover -s analysis/tests -v
      - name: Generate matched exploratory experiments and verify SQLite replay
        run: |
          cargo run --locked --quiet -p cl0-lab --bin cl0-explore -- "$RUNNER_TEMP/cl0-acceptance.sqlite" 4 54129
          python3 analysis/analyze.py "$RUNNER_TEMP/cl0-acceptance.sqlite" --json "$RUNNER_TEMP/cl0-acceptance.json" --csv "$RUNNER_TEMP/cl0-acceptance.csv"
          python3 -c 'import json,os,pathlib; d=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"cl0-acceptance.json").read_text()); assert d["counts"]["runs"] == 12, d["counts"]; assert d["counts"]["matched_initials"] == 4, d["counts"]; assert d["counts"]["invalid_hash_records"] == 0, d["counts"]; assert all(r["hashes_valid"] for r in d["records"])'
      - name: Install Vue observer dependencies
        run: npm ci --prefix console --no-audit --no-fund
      - name: Build and type-check Vue 3 observer
        run: npm run build --prefix console
      - name: Temporary emit rustfmt output for checked-in format verification
        run: |
          for f in crates/world/src/lib.rs crates/world/src/main.rs crates/lab/src/lib.rs crates/lab/src/main.rs crates/lab/src/bin/cl0-explore.rs; do
            printf 'CL0_FMT_BEGIN:%s:' "$f"
            base64 -w0 "$f"
            printf ':CL0_FMT_END\\n'
          done
