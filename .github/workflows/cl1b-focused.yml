      - '!cl0/crates/world/tests/cl1b_c19a_paid_live_source_calibration.rs'
      - '!cl0/crates/world/tests/cl1b_c19b_paid_live_source_heldout.rs'
      - '!cl0/crates/world/tests/cl1b_c20_paid_ticket_spend_native.rs'
      - '!cl0/crates/world/tests/cl1b_c21_paid_ticket_spend_new_heldout.rs'
      - '!cl0/crates/world/tests/cl1b_c22_paid_self_edit_heldout_roi.rs'
