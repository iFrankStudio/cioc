name: CL-1B focused native experiments

on:
  push:
    branches: [main]
    paths:
      - 'cl1b/**'
      - 'cl0/crates/world/tests/cl1b_*.rs'
      - '.github/workflows/cl1b-focused.yml'
  pull_request:
    paths:
      - 'cl1b/**'
      - 'cl0/crates/world/tests/cl1b_*.rs'
      - '.github/workflows/cl1b-focused.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cl1b-focused-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-cl1b:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cl0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format check
        run: rustfmt --check crates/world/tests/cl1b_b00_single_actor_self_edit.rs crates/world/tests/cl1b_b01_functional_continuity.rs crates/world/tests/cl1b_b02_native_repair_calibration.rs crates/world/tests/cl1b_b03a_computed_self_variant.rs
      - name: B00 native self-modification
        run: cargo test --locked -p cl0-world --test cl1b_b00_single_actor_self_edit
      - name: B01 functional continuity
        run: cargo test --locked -p cl0-world --test cl1b_b01_functional_continuity
      - name: B02 native repair calibration
        run: cargo test --locked -p cl0-world --test cl1b_b02_native_repair_calibration
      - name: B03a internally computed variant
        run: cargo test --locked -p cl0-world --test cl1b_b03a_computed_self_variant
