            exit 1
          fi
      - name: Run all independent observer analyses; preserve every failure
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cl1b-ci-evidence
          node --version > cl1b-ci-evidence/observer-node-version.txt
          observers=(
            b13_edge_mutation_scan
            b14_search_policy_path_audit
            b15_policy_generalization
            b16_functional_challenge_scan
            b17_challenge_mutation_scan
            b19_compute_flux_model
            b20_resource_feedback_barrier
            b21_cooperative_compute_relay
            b22_native_relay_assembly
            b23_assembly_cost_solo_scan
            b24_online_request_edit_scan
            b25_neutral_competition_scan
            b26_native_variant_lineage_scan
            b27_multigeneration_self_copy_scan
            b28_cumulative_genome_mutation_scan
            b29_mutation_rule_siblings_scan
            b30_heldout_sibling_threshold_scan
            b31_paid_pool_sensing_scan
            b32_paid_pruning_scan
            b33_sensor_freshness_scan
            b34_nonblocking_feedback_scan
            b35_multitrial_retention_scan
            b36_direct_pool_execution_scan
            b37_neutral_direct_pool_contention_scan
            b38_functional_readback_scan
            b39_temporal_task_evidence_scan
            b40_postwrite_recheck_scan
            b41_candidate_feedback_retention_scan
            b42_self_assembled_probe_scan
            b43_feedback_provenance_scan
            b44_causal_history_alias_scan
            b45_paid_last_writer_scan
            b46_same_writer_race_scan
            b47_source_structure
            b49_dynamic_native_trace_replay
            b50_paid_feedback_vs_forced_scan
            b51b_native_candidate_replay
            b51c_native_paid_search_replay
            b51d_midlife_regime_replay
            b52_native_paid_revalidation_replay
            b53_native_response_correlation_replay
            b54_native_interleaving_replay
            b55a_paid_monitor_choice_preflight_replay
            b55b_online_monitor_rate_pilot_replay
            b56_f0_paid_monitor_assembly_replay
            b56_f1a_native_feedback_ablation_replay
            b56_f1b_two_native_monitor_routes_replay
            b56_f1c_pilot_ordered_trial_replay
            b56_f1d_source_monitor_cost_check
            b56_f1d0_native_monitor_cost_replay
            b56_f1d1a_native_correlated_receipt_replay
            b56_f1d1b_founder_capacity_and_live_cells_audit
            b56_f1d1c_native_branch_template_closure_audit
            b56_f1d1d_native_graph_encode_paid_replay
            b56_f1d1f_same_pid_virtual_bytecode_replay
            b56_f1d1g_same_pid_multi_bytecode_replay
            b56_f1d1h_paid_candidate_retention_replay
            b56_f1d1i_conditioned_mutation_rollback_replay
            b56_f1d1j_paid_rule_memory_replay
            b56_f1d1k_g1_two_level_meta_rule_replay
            b56_f1d1k_g2s_noncommuting_meta_rule_replay
            b56_f1d1k_g3p_paid_duplicate_repair_replay
            b56_f1d1k_g3q_c0_paid_coverage_certificate_replay
          )
          if [ "${#observers[@]}" -ne 63 ]; then
            echo "Expected 63 named independent observers, got ${#observers[@]}" >&2
            exit 1
          fi
          observer_failures=0
          for observer in "${observers[@]}"; do
            if node "../cl1b/analysis/${observer}.mjs" \
              > "cl1b-ci-evidence/${observer}.json" \
              2> "cl1b-ci-evidence/${observer}.stderr.log"; then
              echo "PASS observer=${observer}" | tee -a cl1b-ci-evidence/summary.txt
            else
              echo "FAIL observer=${observer}" | tee -a cl1b-ci-evidence/summary.txt
              observer_failures=$((observer_failures + 1))
            fi
          done
          echo "failed_observer_count=${observer_failures}" | tee -a cl1b-ci-evidence/summary.txt
          if [ "${observer_failures}" -ne 0 ]; then
            exit 1
          fi
      - name: Upload verifiable native CL-1B logs (including failed runs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cl1b-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: cl0/cl1b-ci-evidence/
          if-no-files-found: warn
          retention-days: 30

  # Separate least-privilege job: the code-running test job stays read-only.
  # Publish exact source SHA, run conclusion and raw logs to a non-main branch,
  # so project researchers can inspect native results through GitHub read access.
  # This branch is never a CL-1B workflow trigger and cannot cause CI loops.
  publish-native-evidence:
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [native-cl1b]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
      - name: Switch to isolated evidence branch
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin cl1b-ci-evidence >/dev/null; then
            # Evidence has thousands of historical traces: fetch only its current
            # tree without old blobs and checkout only this run's new directory.
            git -c protocol.version=2 fetch --depth=1 --filter=blob:none origin cl1b-ci-evidence
            git sparse-checkout init --cone
            git sparse-checkout set "run-records/${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            git switch -C cl1b-ci-evidence FETCH_HEAD
          else
            git switch --orphan cl1b-ci-evidence
            # git switch --orphan already clears tracked files; an empty index
            # makes git rm -rf . exit 128 and previously killed reporting.
          fi
      - name: Retrieve native test logs from this exact workflow run
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: cl1b-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: run-records/${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Commit source-pinned result and logs to evidence branch
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
          NATIVE_CONCLUSION: ${{ needs.native-cl1b.result }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          dir="run-records/${SOURCE_SHA}-${RUN_ID}-${RUN_ATTEMPT}"
          mkdir -p "${dir}"
          {
            echo "source_sha=${SOURCE_SHA}"
            echo "native_job_result=${NATIVE_CONCLUSION}"
            echo "run_id=${RUN_ID}"
            echo "run_attempt=${RUN_ATTEMPT}"
            echo "run_url=https://github.com/iFrankStudio/cioc/actions/runs/${RUN_ID}"
          } > "${dir}/result.txt"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "run-records/${SOURCE_SHA}-${RUN_ID}-${RUN_ATTEMPT}"
          git commit -m "ci-evidence: ${NATIVE_CONCLUSION} for ${SOURCE_SHA} run ${RUN_ID}"
          # Independent C14b/C14c archival jobs also write to this evidence branch.
          # A stale expected ref is a harmless race, not a native test failure.
          # Retry a fast-forward rebase of this run's UNIQUE result directory;
          # never force-push or drop another workflow's evidence.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:refs/heads/cl1b-ci-evidence; then
              echo "Evidence published on attempt $attempt"
              exit 0
            fi
            echo "Concurrent evidence branch update; rebase and retry ($attempt/5)" >&2
            git -c protocol.version=2 fetch --depth=32 --filter=blob:none origin cl1b-ci-evidence
            git rebase FETCH_HEAD
          done
          echo "Unable to push source-pinned evidence after 5 conflict retries" >&2
          exit 1
