            cl1b_b13_native_mutation_differential
            cl1b_b14_search_policy_mutation
            cl1b_b15_policy_generalization
            cl1b_b16_functional_challenge
            cl1b_b17_native_challenge_mutation
            cl1b_b18_finite_compute_bound
            cl1b_b19_neutral_compute_flux
            cl1b_b20_resource_feedback_barrier
            cl1b_b21_cooperative_compute_relay
            cl1b_b22_native_relay_assembly
            cl1b_b23_assembly_cost_vs_solo
            cl1b_b24_online_request_edit
            cl1b_b25_neutral_compute_competition
            cl1b_b26_native_variant_lineage
            cl1b_b27_multigeneration_self_copy
