name: CL-1B focused native experiments

on:
  push:
    branches: [main]
    paths:
      - 'cl1b/**'
      - 'cl0/crates/world/tests/cl1b_*.rs'
      - '.github/workflows/cl1b-focused.yml'
  pull_request:
    paths:
      - 'cl1b/**'
      - 'cl0/crates/world/tests/cl1b_*.rs'
      - '.github/workflows/cl1b-focused.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cl1b-focused-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-cl1b:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cl0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: B00 native self-modification
        run: cargo test --locked -p cl0-world --test cl1b_b00_single_actor_self_edit
      - name: B01 functional continuity
        run: cargo test --locked -p cl0-world --test cl1b_b01_functional_continuity
      - name: B02 native repair calibration
        run: cargo test --locked -p cl0-world --test cl1b_b02_native_repair_calibration
      - name: B03a internally computed variant
        run: cargo test --locked -p cl0-world --test cl1b_b03a_computed_self_variant
      - name: B03b trial-feedback selection
        run: cargo test --locked -p cl0-world --test cl1b_b03b_trial_feedback
      - name: B04 CIL-owned checkpoint and rollback
        run: cargo test --locked -p cl0-world --test cl1b_b04_native_checkpoint_rollback
      - name: B05-B06 mutual monitors and checkpoint-poisoning controls
        run: cargo test --locked -p cl0-world --test cl1b_b05_reciprocal_monitors
      - name: B07 double checkpoint agreement and correlated faults
        run: cargo test --locked -p cl0-world --test cl1b_b07_checkpoint_agreement
      - name: B08 observationally identical histories information-loss bound
        run: cargo test --locked -p cl0-world --test cl1b_b08_indistinguishable_histories
