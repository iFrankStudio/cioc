name: CL-1B focused native experiments

on:
  push:
    branches: [main]
    paths:
      - 'cl0/crates/world/src/**'
      - 'cl0/crates/world/tests/cl1b_*.rs'
      - 'cl0/crates/world/Cargo.toml'
      - 'cl0/Cargo.toml'
      - 'cl0/Cargo.lock'
      - 'cl1b/analysis/**'
      - '.github/workflows/cl1b-focused.yml'
  pull_request:
    paths:
      - 'cl0/crates/world/src/**'
      - 'cl0/crates/world/tests/cl1b_*.rs'
      - 'cl0/crates/world/Cargo.toml'
      - 'cl0/Cargo.toml'
      - 'cl0/Cargo.lock'
      - 'cl1b/analysis/**'
      - '.github/workflows/cl1b-focused.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cl1b-focused-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-cl1b:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: cl0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cl0
      - name: Run changed CL-1B targets, or all on kernel/build/workflow change and manual dispatch
        shell: bash
        env:
          DIFF_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          mkdir -p cl1b-ci-evidence
          {
            echo "repository=iFrankStudio/cioc"
            echo "source_sha=${GITHUB_SHA}"
            echo "workflow_run_id=${GITHUB_RUN_ID}"
            echo "workflow_run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "runner_os=${RUNNER_OS}"
            echo "rustc=$(rustc --version)"
            echo "cargo=$(cargo --version)"
          } > cl1b-ci-evidence/provenance.txt
          targets=(
            cl1b_b00_single_actor_self_edit
            cl1b_b01_functional_continuity
            cl1b_b02_native_repair_calibration
            cl1b_b03a_computed_self_variant
            cl1b_b03b_trial_feedback
            cl1b_b04_native_checkpoint_rollback
            cl1b_b05_reciprocal_monitors
            cl1b_b07_checkpoint_agreement
            cl1b_b08_indistinguishable_histories
            cl1b_b09_trial_evidence
            cl1b_b10_freshness
            cl1b_b11_serial_candidate_search
            cl1b_b12_marker_function_divergence
            cl1b_b13_native_mutation_differential
            cl1b_b14_search_policy_mutation
            cl1b_b15_policy_generalization
            cl1b_b16_functional_challenge
            cl1b_b17_native_challenge_mutation
            cl1b_b18_finite_compute_bound
            cl1b_b19_neutral_compute_flux
            cl1b_b20_resource_feedback_barrier
            cl1b_b21_cooperative_compute_relay
            cl1b_b22_native_relay_assembly
            cl1b_b23_assembly_cost_vs_solo
            cl1b_b24_online_request_edit
            cl1b_b25_neutral_compute_competition
            cl1b_b26_native_variant_lineage
            cl1b_b27_multigeneration_self_copy
            cl1b_b28_cumulative_genome_mutation
            cl1b_b29_mutation_rule_siblings
            cl1b_b31_pool_sensing
            cl1b_b32_prune_metabolic_loop
            cl1b_b33_sensor_freshness
            cl1b_b34_nonblocking_resource_feedback
            cl1b_b35_multitrial_retention
            cl1b_b36_neutral_direct_pool_execution
            cl1b_b37_direct_pool_contention
            cl1b_b38_functional_readback
            cl1b_b39_temporal_task_evidence
            cl1b_b40_postwrite_recheck
            cl1b_b41_candidate_feedback_retention
            cl1b_b42_self_assembled_probe
            cl1b_b43_feedback_provenance
            cl1b_b44_causal_history_alias
            cl1b_b45_paid_last_writer
            cl1b_b46_same_writer_race
            cl1b_b47_retention_phase
            cl1b_b49_dynamic_replay
            cl1b_b50_feedback_vs_forced_clone
            cl1b_b51b_native_candidate_composition
            cl1b_b51c_paid_search_retention
            cl1b_b51d_midlife_regime_shift
            cl1b_b52_native_paid_revalidation
            cl1b_b53_native_response_correlation
            cl1b_b54_native_interleaving
            cl1b_b55a_paid_monitor_choice_preflight
            cl1b_b55b_online_monitor_rate_pilot
            cl1b_b56_f0_paid_monitor_assembly
            cl1b_b56_f1_founder_feedback_cut
            cl1b_b56_f1b_two_native_monitor_routes
            cl1b_b56_f1c_pilot_ordered_trial
            cl1b_b56_f1d0_monitor_path_calibration
            cl1b_b56_f1d1d_paid_graph_encode_preflight
            cl1b_b56_f1d1f_same_pid_virtual_bytecode
            cl1b_b56_f1d1g_same_pid_multi_bytecode
            cl1b_b56_f1d1h_paid_candidate_retention
            cl1b_b56_f1d1i_conditioned_mutation_rollback
            cl1b_b56_f1d1j_paid_mutation_rule_memory
            cl1b_b56_f1d1k_g1_two_level_meta_rule
            cl1b_b56_f1d1k_g2s_noncommuting_meta_rule
            cl1b_b56_f1d1k_g3p_paid_duplicate_repair
            cl1b_b56_f1d1k_g3q_c0_paid_coverage_certificate
            cl1b_b56_f1d1k_g3q_c1_p0_paid_bank_deployment
            cl1b_b56_f1d1k_g3q_c1_p1_l1_rule_arithmetic
            cl1b_b56_f1d1k_g3q_c1_p1_l2_m0_three_meta_word_executor
            cl1b_b56_f1d1k_g3q_c1_p1_l2_m1_certified_bank_reexecution
            cl1b_b56_f1d1k_g3q_c1_p1_l2_m2_self_terminal_rule_cycle
          )
          # B56-F1d0: 32 original VM monitor price calibration worlds, 16
          # feedback masks per policy, source-parsed dynamic 1:1 replay.
          # Do NOT interpret as within-PID invention or full F1d success.
          # B56-F1b completed 80k-instruction mechanical/negative pilot audit.
          # B56-F1c exact-source FULL 61-native +48-observer history regression
          # after native route telemetry correction (do not replace raw failures).
          # B56-F1b is a fixed-order TWO paid service monitor assembly pilot,
          # NOT the complete full-F1 causal selector (no order balance/edit-only ablation).
                    # Fail closed on any silent native integration test omission,
          # including full workflows where a new file was not in the manifest.
          # This is a file/manifest audit, not additional runtime testing.
          declared_count="${#targets[@]}"
          actual_count=0
          for source in crates/world/tests/cl1b_*.rs; do
            [ -f "${source}" ] || continue
            actual_count=$((actual_count + 1))
            basename="${source##*/}"
            actual_target="${basename%.rs}"
            registered=0
            for expected in "${targets[@]}"; do
              if [ "${expected}" = "${actual_target}" ]; then
                registered=1
                break
              fi
            done
            if [ "${registered}" -ne 1 ]; then
              echo "Unregistered native integration source: ${source}" >&2
              exit 1
            fi
          done
          if [ "${actual_count}" -ne "${declared_count}" ]; then
            echo "Native manifest mismatch: declared=${declared_count} actual=${actual_count}" >&2
            exit 1
          fi
          # The B49 observer needs the native trace generated in the same CI job.
          # Select its native producer on every scoped run, instead of
          # weakening the fail-closed observer by skipping a missing artifact.
          # Only a changed test and its direct imports need routine validation.
          # Full suite is available through workflow_dispatch, and required
          # when kernel semantics, Cargo dependencies or this workflow change.
          full=0
          changed=()
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] ||
             [ -z "${DIFF_BASE_SHA}" ] ||
             [[ "${DIFF_BASE_SHA}" =~ ^0+$ ]]; then
            full=1
          else
            if ! git cat-file -e "${DIFF_BASE_SHA}^{commit}" 2>/dev/null; then
              echo "Cannot resolve diff base; run full native suite" >&2
              full=1
            else
              while IFS= read -r name; do
                [ -z "${name}" ] || changed+=("${name}")
              done < <(git diff --name-only "${DIFF_BASE_SHA}" HEAD)
            fi
          fi
          selected=()
          declare -A wanted=()
          if [ "${full}" -eq 0 ]; then
            for changed_path in "${changed[@]}"; do
              case "${changed_path}" in
                cl0/crates/world/src/*|cl0/crates/world/Cargo.toml|cl0/Cargo.toml|cl0/Cargo.lock|.github/workflows/cl1b-focused.yml)
                  full=1 ;;
                cl1b/analysis/*.mjs)
                  # Observer-only commits MUST exercise corresponding native
                  # test(s). A zero-test green workflow is not native evidence.
                  observer_file="${changed_path##*/}"
                  study_prefix="${observer_file%%_*}"
                  matching=0
                  for declared in "${targets[@]}"; do
                    if [[ "${declared}" == "cl1b_${study_prefix}_"* ]]; then
                      wanted["${declared}"]=1
                      matching=$((matching+1))
                    fi
                  done
                  if [ "${matching}" -eq 0 ]; then
                    echo "No native target matched modified observer ${observer_file}; fall back to FULL Rust suite" >&2
                    full=1
                  fi ;;
                cl0/crates/world/tests/cl1b_*.rs)
                  name="${changed_path##*/}"
                  native_target="${name%.rs}"
                  registered=0
                  for declared in "${targets[@]}"; do
                    if [ "${declared}" = "${native_target}" ]; then
                      registered=1
                      break
                    fi
                  done
                  if [ "${registered}" -ne 1 ]; then
                    echo "CL-1B test file ${name} is absent from the native target manifest; rejecting zero-test green CI" >&2
                    exit 1
                  fi
                  wanted["${native_target}"]=1
                  case "${name}" in
                    cl1b_b10_freshness.rs) wanted[cl1b_b13_native_mutation_differential]=1 ;;
                    cl1b_b14_search_policy_mutation.rs) wanted[cl1b_b15_policy_generalization]=1 ;;
                    cl1b_b16_functional_challenge.rs) wanted[cl1b_b17_native_challenge_mutation]=1 ;;
                    cl1b_b22_native_relay_assembly.rs) wanted[cl1b_b23_assembly_cost_vs_solo]=1 ;;
                    cl1b_b31_pool_sensing.rs) wanted[cl1b_b33_sensor_freshness]=1 ;;
                    cl1b_b35_multitrial_retention.rs) wanted[cl1b_b36_neutral_direct_pool_execution]=1 ;;
                    cl1b_b38_functional_readback.rs) wanted[cl1b_b39_temporal_task_evidence]=1; wanted[cl1b_b40_postwrite_recheck]=1 ;;
                    cl1b_b42_self_assembled_probe.rs) wanted[cl1b_b43_feedback_provenance]=1; wanted[cl1b_b44_causal_history_alias]=1; wanted[cl1b_b45_paid_last_writer]=1; wanted[cl1b_b46_same_writer_race]=1; wanted[cl1b_b49_dynamic_replay]=1 ;;
                  esac ;;
              esac
            done
          fi
          # B52 adds a paid task-feedback source controller and its source-parsed
          # independent interpreter; explicitly exercise the full 55/42 suite
          # before publishing organism-level interpretation.
          # B54 proves the same authored B53 nonce-check source can be fooled
          # by an external bit mutation between verified serial/commit and
          # the native paid feedback Read. Preserve exact step-level replay.
          # B55a limited pilot is not the original full preregistered B55a study.
          # Run the full 56 native targets and43 source-pinned independent observers.
          # B55a feasibility is a narrowly labeled 5-arm/2-ecology/4-seed pilot;
          # do not promote to preregistered full B55a Tier 1 success.
          # Corrected B56-F0 strict origin audit: B51c already contained
          # post-Write training feedback Read, so generated service linkage
          # does NOT establish a wholly novel monitoring capability.
          # B56-F0 source provenance and clone/patch audit: complete full
          # 58-native +45-independent regression after scoped 11-native pass.
          # All twelve event-backed observers require native artifacts from
          # this exact source revision; B51d additionally imports B51c's
          # unchanged CIL founder. Run all event producers in scoped jobs,
          # failing closed rather than accepting a missing native trace.
          if [ "${full}" -eq 0 ]; then
            wanted[cl1b_b49_dynamic_replay]=1
            wanted[cl1b_b50_feedback_vs_forced_clone]=1
            wanted[cl1b_b51b_native_candidate_composition]=1
            wanted[cl1b_b51c_paid_search_retention]=1
            wanted[cl1b_b51d_midlife_regime_shift]=1
            wanted[cl1b_b52_native_paid_revalidation]=1
            wanted[cl1b_b53_native_response_correlation]=1
            wanted[cl1b_b54_native_interleaving]=1
            wanted[cl1b_b55a_paid_monitor_choice_preflight]=1
            wanted[cl1b_b55b_online_monitor_rate_pilot]=1
            wanted[cl1b_b56_f0_paid_monitor_assembly]=1
            wanted[cl1b_b56_f1_founder_feedback_cut]=1
            # These always-on observers require SAME-SHA native producer traces,
            # even on changed-only CI runs. Do not permit false-green/false-red.
            wanted[cl1b_b56_f1b_two_native_monitor_routes]=1
            wanted[cl1b_b56_f1c_pilot_ordered_trial]=1
            wanted[cl1b_b56_f1d0_monitor_path_calibration]=1
            wanted[cl1b_b56_f1d1d_paid_graph_encode_preflight]=1
            wanted[cl1b_b56_f1d1f_same_pid_virtual_bytecode]=1
            wanted[cl1b_b56_f1d1g_same_pid_multi_bytecode]=1
            wanted[cl1b_b56_f1d1h_paid_candidate_retention]=1
            wanted[cl1b_b56_f1d1i_conditioned_mutation_rollback]=1
            wanted[cl1b_b56_f1d1j_paid_mutation_rule_memory]=1
            wanted[cl1b_b56_f1d1k_g1_two_level_meta_rule]=1
            wanted[cl1b_b56_f1d1k_g2s_noncommuting_meta_rule]=1
            wanted[cl1b_b56_f1d1k_g3p_paid_duplicate_repair]=1
            wanted[cl1b_b56_f1d1k_g3q_c0_paid_coverage_certificate]=1
            wanted[cl1b_b56_f1d1k_g3q_c1_p0_paid_bank_deployment]=1
            wanted[cl1b_b56_f1d1k_g3q_c1_p1_l1_rule_arithmetic]=1
            wanted[cl1b_b56_f1d1k_g3q_c1_p1_l2_m0_three_meta_word_executor]=1
            wanted[cl1b_b56_f1d1k_g3q_c1_p1_l2_m1_certified_bank_reexecution]=1
            wanted[cl1b_b56_f1d1k_g3q_c1_p1_l2_m2_self_terminal_rule_cycle]=1
          fi
          for target in "${targets[@]}"; do
            if [ "${full}" -eq 1 ] || [ "${wanted[${target}]:-0}" -eq 1 ]; then
              selected+=("${target}")
            fi
          done
          if [ "${#selected[@]}" -eq 0 ]; then
            echo "Zero CL-1B native targets selected; fail closed rather than publishing a false-green verification" >&2
            exit 1
          fi
          # Detect silent omission of an integration target from the native
          # full-campaign denominator. Update this deliberately with each Study.
          if [ "${full}" -eq 1 ] && [ "${#selected[@]}" -ne 77 ]; then
            echo "Expected exactly 77 native CL-1B integration targets, got ${#selected[@]}" >&2
            exit 1
          fi
          {
            echo "scope=$(if [ "${full}" -eq 1 ]; then echo full; else echo changed-only; fi)"
            echo "selected_native_targets=${#selected[@]}"
            printf "changed_path=%s\n" "${changed[@]}"
          } | tee -a cl1b-ci-evidence/summary.txt
          failures=0
          for target in "${selected[@]}"; do
            echo "RUN ${target}" | tee -a cl1b-ci-evidence/summary.txt
            # pipefail retains cargo's failure even though stdout is archived.
            if cargo test --locked -p cl0-world --test "${target}" -- --nocapture \
              2>&1 | tee "cl1b-ci-evidence/${target}.log"; then
              echo "PASS ${target}" | tee -a cl1b-ci-evidence/summary.txt
            else
              echo "FAIL ${target}" | tee -a cl1b-ci-evidence/summary.txt
              failures=$((failures + 1))
            fi
          done
          # The new generic instruction uses private numeric codec helpers.
          # Integration targets cover execution; library tests cover the
          # on-disk/code-graph ABI and serde compatibility. Never silently omit.
          if cargo test --locked -p cl0-world --lib b31_pool_sensor -- --nocapture \
            2>&1 | tee cl1b-ci-evidence/b31_pool_sensor_abi.log; then
            echo "PASS lib=b31_pool_sensor_abi" | tee -a cl1b-ci-evidence/summary.txt
          else
            echo "FAIL lib=b31_pool_sensor_abi" | tee -a cl1b-ci-evidence/summary.txt
            failures=$((failures + 1))
          fi
          if cargo test --locked -p cl0-world --lib b34_trydraw -- --nocapture \
            2>&1 | tee cl1b-ci-evidence/b34_trydraw_abi.log; then
            echo "PASS lib=b34_trydraw_abi" | tee -a cl1b-ci-evidence/summary.txt
          else
            echo "FAIL lib=b34_trydraw_abi" | tee -a cl1b-ci-evidence/summary.txt
            failures=$((failures + 1))
          fi
          # G3Q-C1-P0: an independently implemented source interpreter must
          # agree with the Rust original's published aggregate evidence.
          # This is NOT an event-by-event native observer.
          if printf '%s\n' "${selected[@]}" | grep -qx 'cl1b_b56_f1d1k_g3q_c1_p0_paid_bank_deployment'; then
            native_summary=cl1b-ci-evidence/b56_f1d1k_g3q_c1_p0_paid_bank_deployment_summary.json
            if [ -f "${native_summary}" ] && python3 ../cl1b/analysis/g3q_c1_p0_native_summary_crosscheck.py "${native_summary}" \
              > cl1b-ci-evidence/g3q_c1_p0_native_summary_crosscheck.json \
              2> cl1b-ci-evidence/g3q_c1_p0_native_summary_crosscheck.stderr.log; then
              echo "PASS source-model/native-summary=g3q_c1_p0" | tee -a cl1b-ci-evidence/summary.txt
            else
              echo "FAIL source-model/native-summary=g3q_c1_p0" | tee -a cl1b-ci-evidence/summary.txt
              failures=$((failures + 1))
            fi
          fi
          # P1-L1 independent frozen-source replay vs same-source Rust aggregate.
          # The observer is aggregate-only, never claimed as per-event replay.
          if printf '%s\n' "${selected[@]}" | grep -qx 'cl1b_b56_f1d1k_g3q_c1_p1_l1_rule_arithmetic'; then
            native_p1=cl1b-ci-evidence/b56_f1d1k_g3q_c1_p1_l1_native_rule_arithmetic.json
            if [ -f "${native_p1}" ] && python3 ../cl1b/analysis/g3q_c1_p1_l1_native_aggregate_replay.py "${native_p1}" \
              > cl1b-ci-evidence/g3q_c1_p1_l1_native_aggregate_replay.json \
              2> cl1b-ci-evidence/g3q_c1_p1_l1_native_aggregate_replay.stderr.log; then
              echo "PASS source-model/native-aggregate=g3q_c1_p1_l1" | tee -a cl1b-ci-evidence/summary.txt
            else
              echo "FAIL source-model/native-aggregate=g3q_c1_p1_l1" | tee -a cl1b-ci-evidence/summary.txt
              failures=$((failures + 1))
            fi
          fi
          # P1-L2-M0: independently interpret the frozen CIL meta bytecode and
          # reject native Rust aggregate results that contradict source physics.
          if printf '%s\n' "${selected[@]}" | grep -qx 'cl1b_b56_f1d1k_g3q_c1_p1_l2_m0_three_meta_word_executor'; then
            native_l2=cl1b-ci-evidence/b56_f1d1k_g3q_c1_p1_l2_m0_native_three_word_executor.json
            if [ -f "${native_l2}" ] && python3 ../cl1b/analysis/g3q_c1_p1_l2_m0_source_replay.py "${native_l2}" \
              > cl1b-ci-evidence/g3q_c1_p1_l2_m0_source_crosscheck.json \
              2> cl1b-ci-evidence/g3q_c1_p1_l2_m0_source_crosscheck.stderr.log; then
              echo "PASS native/source-aggregate=g3q_c1_p1_l2_m0" | tee -a cl1b-ci-evidence/summary.txt
            else
              echo "FAIL native/source-aggregate=g3q_c1_p1_l2_m0" | tee -a cl1b-ci-evidence/summary.txt
              failures=$((failures + 1))
            fi
          fi
          # P1-L2-M1: actor paid a complete 64-rule certificate and then
          # actually reread its own retained bank into three dynamic meta slots.
          # Independent source replay checks aggregate only, NOT per-native-event.
          if printf '%s\n' "${selected[@]}" | grep -qx 'cl1b_b56_f1d1k_g3q_c1_p1_l2_m1_certified_bank_reexecution'; then
            native_m1=cl1b-ci-evidence/b56_f1d1k_g3q_c1_p1_l2_m1_paid_certified_bank_reexecution.json
            if [ -f "${native_m1}" ] && python3 ../cl1b/analysis/g3q_c1_p1_l2_m1_independent_prefix_replay.py "${native_m1}" \
              > cl1b-ci-evidence/g3q_c1_p1_l2_m1_independent_prefix_replay.json \
              2> cl1b-ci-evidence/g3q_c1_p1_l2_m1_independent_prefix_replay.stderr.log; then
              echo "PASS native/source-aggregate=g3q_c1_p1_l2_m1" | tee -a cl1b-ci-evidence/summary.txt
            else
              echo "FAIL native/source-aggregate=g3q_c1_p1_l2_m1" | tee -a cl1b-ci-evidence/summary.txt
              failures=$((failures + 1))
            fi
          fi
          # P1-L2-M1 stronger original native verification: source-parse
          # frozen CIL and reexecute EVERY paid original native PID instruction
          # against PC, all four registers, private credits, cell presence
          # and exact storage. Two independent source-preload arms, no oracle.
          if printf '%s\n' "${selected[@]}" | grep -qx 'cl1b_b56_f1d1k_g3q_c1_p1_l2_m1_certified_bank_reexecution'; then
            m1_summary=cl1b-ci-evidence/b56_f1d1k_g3q_c1_p1_l2_m1_paid_certified_bank_reexecution.json
            m1_original=cl1b-ci-evidence/b56_f1d1k_g3q_c1_p1_l2_m1_paid_prefix_original.jsonl
            m1_control=cl1b-ci-evidence/b56_f1d1k_g3q_c1_p1_l2_m1_paid_prefix_bank_tail_address_mutant.jsonl
            if [ -f "${m1_summary}" ] && [ -f "${m1_original}" ] && [ -f "${m1_control}" ] && \
              python3 ../cl1b/analysis/g3q_c1_p1_l2_m1_independent_native_step_replay.py \
                "${m1_summary}" "${m1_original}" "${m1_control}" \
              > cl1b-ci-evidence/g3q_c1_p1_l2_m1_independent_native_step_replay.json \
              2> cl1b-ci-evidence/g3q_c1_p1_l2_m1_independent_native_step_replay.stderr.log; then
              echo "PASS independent-native-step-replay=g3q_c1_p1_l2_m1" | tee -a cl1b-ci-evidence/summary.txt
            else
              echo "FAIL independent-native-step-replay=g3q_c1_p1_l2_m1" | tee -a cl1b-ci-evidence/summary.txt
              failures=$((failures + 1))
            fi
          fi
          # P1-L2-M2: a single original PID1 must causally PatchNext itself,
          # interpret its own retained complete meta-rule, and then naturally Halt.
          # Independently replay all 48,298 charged native steps and the edited
          # executable edge; reject any missing original evidence or divergence.
          if printf '%s\n' "${selected[@]}" | grep -qx 'cl1b_b56_f1d1k_g3q_c1_p1_l2_m2_self_terminal_rule_cycle'; then
            m2_summary=cl1b-ci-evidence/b56_f1d1k_g3q_c1_p1_l2_m2_native_self_terminal_meta_cycle.json
            m2_base=cl1b-ci-evidence/b56_f1d1k_g3q_c1_p1_l2_m2_original_paid_steps_original.jsonl
            m2_mutant=cl1b-ci-evidence/b56_f1d1k_g3q_c1_p1_l2_m2_original_paid_steps_preload_tail_bank_address_mutant.jsonl
            if [ -f "${m2_summary}" ] && [ -f "${m2_base}" ] && [ -f "${m2_mutant}" ] && \
              python3 ../cl1b/analysis/g3q_c1_p1_l2_m2_independent_native_terminal_replay.py \
                "${m2_summary}" "${m2_base}" "${m2_mutant}" \
              > cl1b-ci-evidence/g3q_c1_p1_l2_m2_independent_native_terminal_replay.json \
              2> cl1b-ci-evidence/g3q_c1_p1_l2_m2_independent_native_terminal_replay.stderr.log; then
              echo "PASS native-independent-every-step=g3q_c1_p1_l2_m2" | tee -a cl1b-ci-evidence/summary.txt
            else
              echo "FAIL native-independent-every-step=g3q_c1_p1_l2_m2" | tee -a cl1b-ci-evidence/summary.txt
              failures=$((failures + 1))
            fi
          fi
          echo "failed_target_count=${failures}" | tee -a cl1b-ci-evidence/summary.txt
          if [ "${failures}" -ne 0 ]; then
            exit 1
          fi
      - name: Run all independent observer analyses; preserve every failure
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cl1b-ci-evidence
          node --version > cl1b-ci-evidence/observer-node-version.txt
          observers=(
            b13_edge_mutation_scan
            b14_search_policy_path_audit
            b15_policy_generalization
            b16_functional_challenge_scan
            b17_challenge_mutation_scan
            b19_compute_flux_model
            b20_resource_feedback_barrier
            b21_cooperative_compute_relay
            b22_native_relay_assembly
            b23_assembly_cost_solo_scan
            b24_online_request_edit_scan
            b25_neutral_competition_scan
            b26_native_variant_lineage_scan
            b27_multigeneration_self_copy_scan
            b28_cumulative_genome_mutation_scan
            b29_mutation_rule_siblings_scan
            b30_heldout_sibling_threshold_scan
            b31_paid_pool_sensing_scan
            b32_paid_pruning_scan
            b33_sensor_freshness_scan
            b34_nonblocking_feedback_scan
            b35_multitrial_retention_scan
            b36_direct_pool_execution_scan
            b37_neutral_direct_pool_contention_scan
            b38_functional_readback_scan
            b39_temporal_task_evidence_scan
            b40_postwrite_recheck_scan
            b41_candidate_feedback_retention_scan
            b42_self_assembled_probe_scan
            b43_feedback_provenance_scan
            b44_causal_history_alias_scan
            b45_paid_last_writer_scan
            b46_same_writer_race_scan
            b47_source_structure
            b49_dynamic_native_trace_replay
            b50_paid_feedback_vs_forced_scan
            b51b_native_candidate_replay
            b51c_native_paid_search_replay
            b51d_midlife_regime_replay
            b52_native_paid_revalidation_replay
            b53_native_response_correlation_replay
            b54_native_interleaving_replay
            b55a_paid_monitor_choice_preflight_replay
            b55b_online_monitor_rate_pilot_replay
            b56_f0_paid_monitor_assembly_replay
            b56_f1a_native_feedback_ablation_replay
            b56_f1b_two_native_monitor_routes_replay
            b56_f1c_pilot_ordered_trial_replay
            b56_f1d_source_monitor_cost_check
            b56_f1d0_native_monitor_cost_replay
            b56_f1d1a_native_correlated_receipt_replay
            b56_f1d1b_founder_capacity_and_live_cells_audit
            b56_f1d1c_native_branch_template_closure_audit
            b56_f1d1d_native_graph_encode_paid_replay
            b56_f1d1f_same_pid_virtual_bytecode_replay
            b56_f1d1g_same_pid_multi_bytecode_replay
            b56_f1d1h_paid_candidate_retention_replay
            b56_f1d1i_conditioned_mutation_rollback_replay
            b56_f1d1j_paid_rule_memory_replay
            b56_f1d1k_g1_two_level_meta_rule_replay
            b56_f1d1k_g2s_noncommuting_meta_rule_replay
            b56_f1d1k_g3p_paid_duplicate_repair_replay
            b56_f1d1k_g3q_c0_paid_coverage_certificate_replay
          )
          if [ "${#observers[@]}" -ne 63 ]; then
            echo "Expected 63 named independent observers, got ${#observers[@]}" >&2
            exit 1
          fi
          observer_failures=0
          for observer in "${observers[@]}"; do
            if node "../cl1b/analysis/${observer}.mjs" \
              > "cl1b-ci-evidence/${observer}.json" \
              2> "cl1b-ci-evidence/${observer}.stderr.log"; then
              echo "PASS observer=${observer}" | tee -a cl1b-ci-evidence/summary.txt
            else
              echo "FAIL observer=${observer}" | tee -a cl1b-ci-evidence/summary.txt
              observer_failures=$((observer_failures + 1))
            fi
          done
          echo "failed_observer_count=${observer_failures}" | tee -a cl1b-ci-evidence/summary.txt
          if [ "${observer_failures}" -ne 0 ]; then
            exit 1
          fi
      - name: Upload verifiable native CL-1B logs (including failed runs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cl1b-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: cl0/cl1b-ci-evidence/
          if-no-files-found: warn
          retention-days: 30

  # Separate least-privilege job: the code-running test job stays read-only.
  # Publish exact source SHA, run conclusion and raw logs to a non-main branch,
  # so project researchers can inspect native results through GitHub read access.
  # This branch is never a CL-1B workflow trigger and cannot cause CI loops.
  publish-native-evidence:
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [native-cl1b]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
      - name: Switch to isolated evidence branch
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin cl1b-ci-evidence >/dev/null; then
            git fetch origin cl1b-ci-evidence
            git switch -C cl1b-ci-evidence FETCH_HEAD
          else
            git switch --orphan cl1b-ci-evidence
            # git switch --orphan already clears tracked files; an empty index
            # makes git rm -rf . exit 128 and previously killed reporting.
          fi
      - name: Retrieve native test logs from this exact workflow run
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: cl1b-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: run-records/${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Commit source-pinned result and logs to evidence branch
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
          NATIVE_CONCLUSION: ${{ needs.native-cl1b.result }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          dir="run-records/${SOURCE_SHA}-${RUN_ID}-${RUN_ATTEMPT}"
          mkdir -p "${dir}"
          {
            echo "source_sha=${SOURCE_SHA}"
            echo "native_job_result=${NATIVE_CONCLUSION}"
            echo "run_id=${RUN_ID}"
            echo "run_attempt=${RUN_ATTEMPT}"
            echo "run_url=https://github.com/iFrankStudio/cioc/actions/runs/${RUN_ID}"
          } > "${dir}/result.txt"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "run-records/${SOURCE_SHA}-${RUN_ID}-${RUN_ATTEMPT}"
          git commit -m "ci-evidence: ${NATIVE_CONCLUSION} for ${SOURCE_SHA} run ${RUN_ID}"
          git push origin HEAD:refs/heads/cl1b-ci-evidence
