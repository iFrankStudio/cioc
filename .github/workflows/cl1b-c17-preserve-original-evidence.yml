name: CL-1B preserve verified C17 original native evidence

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cl1b-c17-preserve-original-evidence.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: cl1b-c17-permanent-native-evidence
  cancel-in-progress: false

jobs:
  preserve-verified-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
      - name: Download and check original-success C17 artifact, exact byte hash and 274 traces
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/cl1b-c17-preserve
          curl --fail --location --retry 3 --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/iFrankStudio/cioc/actions/artifacts/14792844372/zip" \
            -o /tmp/cl1b-c17-preserve/original-native.zip
          echo '29c295382848fb4fe944221766ae51324ada87726120d97d674b93fed551878c  /tmp/cl1b-c17-preserve/original-native.zip' | sha256sum -c -
          python3 - <<'PY'
          import json,zipfile
          p='/tmp/cl1b-c17-preserve/original-native.zip'
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              names=z.namelist()
              assert len(names)==len(set(names))==278,len(names)
              assert sum(n.endswith('.jsonl') for n in names)==274
              d=json.loads(z.read('cl1b_c17_original_native_274_worlds.json'))
              a=json.loads(z.read('cl1b_c17_independent_replay.json'))
              assert d['study']=='CL1B-C17-ONE-SHOT-PAID-POSTEDIT-FEEDBACK-VETO'
              assert d['native_worlds']==274 and len(d['records'])==45
              assert d['total_paid_cil']==a['exact_private_paid_cil_replayed']==1147263
              assert a['first_divergence'] is None and a['native_worlds']==274
              assert d['main_actor_paid_success_records']==287
              assert d['main_actual_physical_pc173_restores']==39
              assert d['same_source_live_vs_postedit_veto_effect_difference_cases']==8
              assert d['arm_completed_worlds']['truth_paid_postedit_feedback_veto']==45
              assert d['arm_completed_worlds']['same_source_pc212_veto_effect_suppressed']==43
              assert d['arm_completed_worlds']['different_source_c9_fixed_abstain']==45
              assert d['arm_fees']['truth_paid_postedit_feedback_veto']==195606
              assert d['arm_fees']['same_source_pc212_veto_effect_suppressed']==200014
              assert d['arm_fees']['different_source_c9_fixed_abstain']==162029
              assert sum(r['arms'][0]['paid_postedit_probe_armed'] for r in d['records'])==57
              assert sum(r['arms'][0]['paid_postedit_probe_disarmed'] for r in d['records'])==57
              assert sum(r['arms'][0]['paid_postedit_veto_written'] for r in d['records'])==8
              assert sum(r['arms'][0]['paid_veto_gate_blocks'] for r in d['records'])==56
              assert sum(r['arms'][1]['paid_postedit_veto_effect_suppressed'] for r in d['records'])==13
              prov=z.read('cl1b-c17-original-provenance.txt').decode()
              assert 'tested_sha=1c998412bddc26d32e8536bc5c7542b9c6ff3fe8' in prov
              assert 'run_id=45120094165' in prov
              print('C17 original native ZIP PASS: all 274 original dynamic self-patched executable PC5 feedback worlds; 57 real probes, 8 paid veto writes, 56 paid blocks')
          PY
      - name: Preserve binary original at immutable run-record path on evidence branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin cl1b-ci-evidence
          git checkout -B cl1b-ci-evidence origin/cl1b-ci-evidence
          dest='run-records/1c998412bddc26d32e8536bc5c7542b9c6ff3fe8-45120094165-1'
          mkdir -p "$dest"
          cp /tmp/cl1b-c17-preserve/original-native.zip "$dest/original-native-artifact.zip"
          echo '29c295382848fb4fe944221766ae51324ada87726120d97d674b93fed551878c  original-native-artifact.zip' > "$dest/original-native-artifact.sha256"
          git add "$dest/original-native-artifact.zip" "$dest/original-native-artifact.sha256"
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'evidence(cl1b): preserve C17 original 274-world paid single-use success certificate native archive'
            # Independent focused-history and C14c archival jobs share this branch.
            # Rebase the unique C17 evidence commit onto the new remote HEAD
            # after a stale-ref rejection. Never force push or drop another run.
            for attempt in 1 2 3 4 5; do
              if git push origin HEAD:cl1b-ci-evidence; then
                echo "C17 original bytes pushed on attempt $attempt"
                break
              fi
              if [ "$attempt" = 5 ]; then
                echo "C17 evidence push still conflicted after five retries" >&2
                exit 1
              fi
              echo "C17 archive branch changed concurrently: retry $attempt/5" >&2
              git fetch origin cl1b-ci-evidence
              git rebase origin/cl1b-ci-evidence
            done
          else
            echo 'Identical C17 bytes already recorded'
          fi
      - name: Fetch back Git archive bytes and repeat independent hash check
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin cl1b-ci-evidence
          dest='run-records/1c998412bddc26d32e8536bc5c7542b9c6ff3fe8-45120094165-1'
          git show "origin/cl1b-ci-evidence:$dest/original-native-artifact.zip" | sha256sum | grep -F '29c295382848fb4fe944221766ae51324ada87726120d97d674b93fed551878c'
          git show "origin/cl1b-ci-evidence:$dest/original-native-artifact.sha256" | grep -F '29c295382848fb4fe944221766ae51324ada87726120d97d674b93fed551878c'
          echo 'C17 independently fetched permanent Git original binary: exact SHA-256 verified'
