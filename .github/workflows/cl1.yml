name: CL-1 preregistered research

on:
  push:
    paths:
      - 'cl1/**/*.py'
      - 'cl0/crates/**'
      - 'cl0/Cargo.toml'
      - 'cl0/Cargo.lock'
      - '.github/workflows/cl1.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 0'

permissions:
  contents: read

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      selected: ${{ steps.choose.outputs.selected }}
      quick: ${{ steps.choose.outputs.quick }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: choose
        name: Select changed studies; run complete suite on shared-kernel edits
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          ids=(study01 study02 study03 study04 study05 study06 study07 study08 study09 study10 study11 study12 study13 study14 study20 study21 study22 study24 study25 study26 study27 study28 study29)
          selected='|'
          quick=false
          full=false
          if [[ "$EVENT" != "push" ]] || [[ -z "$BEFORE" ]] || [[ "$BEFORE" =~ ^0+$ ]]; then
            full=true
          else
            changes="$(git diff --name-only "$BEFORE" "$GITHUB_SHA")"
            if grep -Eq '^(.github/workflows/cl1\.yml|cl0/(Cargo\.(toml|lock)|crates/lab/src/lib\.rs)|cl1/(analyze\.py|analyze_study(02|14|22)\.py))$' <<<"$changes" || grep -Eq '^cl0/crates/world/' <<<"$changes"; then
              full=true
            fi
            if grep -Eq '^(cl1/.*\.py|cl0/crates/)' <<<"$changes"; then
              quick=true
            fi
          fi
          if [[ "$full" == true ]]; then
            quick=true
            for id in "${ids[@]}"; do selected+="$id|"; done
          else
            for id in "${ids[@]}"; do
              if grep -Eq "^cl0/crates/lab/src/bin/cl1-$id\\.rs$|^cl1/(analyze_$id\\.py|tests/test_$id\\.py)$" <<<"$changes"; then
                selected+="$id|"
              fi
            done
          fi
          echo "selected=$selected" >> "$GITHUB_OUTPUT"
          echo "quick=$quick" >> "$GITHUB_OUTPUT"
          echo "Selected study jobs: $selected; quick: $quick"

  quick:
    needs: select
    if: needs.select.outputs.quick == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cl0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fast Rust and Python checks
        run: |
          cargo fmt --all -- --check
          cargo test --locked --workspace
          cargo clippy --locked --workspace --all-targets -- -D warnings
          python3 -m unittest discover -s ../cl1/tests -v

  study01:
    needs: select
    if: contains(needs.select.outputs.selected, '|study01|')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cl0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check frozen preregistration
        run: test -f ../cl1/studies/01-preregistered-random-ecology.md
      - name: Rust formatting, unit tests, strict lint
        run: |
          cargo fmt --all -- --check
          cargo test --locked --workspace
          cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Study 01 64-seed 320-run experiment with exact replay
        run: |
          CL1_SOURCE_REVISION="$GITHUB_SHA" cargo run --locked --quiet -p cl0-lab --bin cl1-study01 -- "$RUNNER_TEMP/cl1-study01.sqlite"
      - name: Independent CL-1 analysis and integrity checks
        run: |
          python3 -m unittest discover -s ../cl1/tests -v
          python3 ../cl1/analyze.py "$RUNNER_TEMP/cl1-study01.sqlite" --json "$RUNNER_TEMP/cl1-study01-report.json"
          cat "$RUNNER_TEMP/cl1-study01-report.json"
      - name: Archive study evidence
        uses: actions/upload-artifact@v4
        with:
          name: cl1-study01
          retention-days: 30
          path: |
            ${{ runner.temp }}/cl1-study01.sqlite
            ${{ runner.temp }}/cl1-study01-report.json

  study02:
    needs: select
    if: contains(needs.select.outputs.selected, '|study02|')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cl0
    steps:
      - uses: actions/checkout@v4
