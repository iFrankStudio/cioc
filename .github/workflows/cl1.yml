        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Study-02 preregistration is available
        run: test -f ../cl1/studies/02-preregistered-reciprocal-causality.md
      - name: Verify all Rust formatting, tests and Clippy
        run: |
          cargo fmt --all -- --check
          cargo test --locked --workspace
          cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Run 128 independent seeds, six matched conditions each, all replays
        run: |
          CL1_SOURCE_REVISION="$GITHUB_SHA" cargo run --locked --quiet -p cl0-lab --bin cl1-study02 -- "$RUNNER_TEMP/cl1-study02.sqlite"
      - name: Audit 128 independent units and reciprocal sensitivity
        run: |
