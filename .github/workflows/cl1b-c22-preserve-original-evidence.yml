name: CL-1B preserve C22 original 141-world paid self-edit negative ROI evidence
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cl1b-c22-preserve-original-evidence.yml'
  workflow_dispatch:
permissions:
  actions: read
  contents: write
concurrency:
  group: cl1b-c22-archive-original-new-goals
  cancel-in-progress: false
jobs:
  preserve-verified-original-native-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
      - name: Download and independently audit original 141-world ZIP, provenance and exact charged CIL
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/cl1b-c22-archive
          curl --fail --location --retry 3 --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/iFrankStudio/cioc/actions/artifacts/14807564637/zip" \
            -o /tmp/cl1b-c22-archive/original-native.zip
          echo 'ef44677809546195960772e7d7dadc093d0a0cf28d2d1adacd35995f93d8a150  /tmp/cl1b-c22-archive/original-native.zip' | sha256sum -c -
          python3 - <<'PY'
          import json,zipfile
          path='/tmp/cl1b-c22-archive/original-native.zip'
          with zipfile.ZipFile(path) as z:
              names=z.namelist()
              assert z.testzip() is None and len(names)==len(set(names))==145
              assert sum(n.endswith('.jsonl') for n in names)==141
              d=json.loads(z.read('cl1b_c22_original_native_141_worlds.json'))
              p=json.loads(z.read('cl1b_c22_independent_paid_replay.json'))
              assert d['study']==p['study']=='CL1B-C22-PAID-PATCHNEXT-SELF-EDIT-RETURN-ON-COMPUTE-NEW-HELDOUT'
              assert d['level']=='ORIGINAL_NATIVE_141_WORLD_P4F6_REUSED_SOURCE_NEW_GOAL_PATCHNEXT_EFFECT_ROI'
              assert d['counts']['worlds']==p['original_native_worlds_exactly_replayed']==141
              assert d['counts']['truthful_worlds']==135 and d['counts']['adversarial']==6
              assert d['counts']['frozen_goal_sequences']==p['new_goal_cases']==45
              assert d['counts']['total_original_paid_instructions']==p['original_charged_CIL_instruction_count_exactly_replayed']
              assert p['first_divergence'] is None
              assert len(d['records'])==45 and len(d['controls'])==6
              assert len(p['strict_same_source_first_physical_PatchNext_divergences'])==45
              eco=p['economic_observations']
              assert (eco['wins'],eco['ties'],eco['losses'])==(0,0,45)
              assert eco['on_true_stages']==eco['off_true_stages']==eco['F5_true_stages']==1080
              assert eco['actor_real_patchconst_edits']==346 and eco['actor_real_patchnext_edits']==300
              assert eco['total_same_source_paid_saving']==-26569
              assert eco['total_cross_source_F5_minus_F6']==-9749
              assert all(r['f6_on']['truthful_matches']==r['f6_off']['truthful_matches']==r['f5_on']['truthful_matches']==24 for r in d['records'])
              assert all(r['same_source_bundle_paid_saving']<0 for r in d['records'])
              assert sum(r['same_source_bundle_paid_saving'] for r in d['records'])==-26569
              assert sum(r['cross_source_f6_vs_f5_paid_saving'] for r in d['records'])==-9749
              provenance=z.read('cl1b-c22-native-provenance.txt').decode()
              assert 'tested_sha=3fec55f901b418b81ed06f08c234a78724024977' in provenance
              assert 'run_id=45156358171' in provenance
              assert 'cohort=45_NEW_UNSEEN_GOAL_SCHEDULES_FULL_PAID_PID_SELF_EDIT_COST' in provenance
              arm_totals={k:sum(r[k]['steps'] for r in d['records']) for k in ('f6_on','f6_off','f5_on')}
              assert arm_totals['f6_off']-arm_totals['f6_on']==-26569
              assert arm_totals['f5_on']-arm_totals['f6_on']==-9749
              print('C22 ORIGINAL 141 paid-native worlds + complete ordinary Python CIL + 45 paired first-effect audits VERIFIED, B3/B4 NOT_MET')
              print('FULL LIFECYCLE PAID CIL ARM TOTALS:',arm_totals)
              print('FIRST REAL PHYSICAL PATCHNEXT EFFECT CASES:',sum(x['first_effect_exposed'] for x in p['strict_same_source_first_physical_PatchNext_divergences']))
          PY
      - name: Preserve exact original artifact binary in permanent Git evidence branch
        shell: bash
        run: |
          set -euo pipefail
          git -c protocol.version=2 fetch --depth=1 --filter=blob:none origin cl1b-ci-evidence
          git sparse-checkout init --cone
          git sparse-checkout set run-records/3fec55f901b418b81ed06f08c234a78724024977-45156358171-1
          git checkout -B cl1b-ci-evidence FETCH_HEAD
          dest='run-records/3fec55f901b418b81ed06f08c234a78724024977-45156358171-1'
          mkdir -p "$dest"
          cp /tmp/cl1b-c22-archive/original-native.zip "$dest/original-native-artifact.zip"
          echo 'ef44677809546195960772e7d7dadc093d0a0cf28d2d1adacd35995f93d8a150  original-native-artifact.zip' > "$dest/original-native-artifact.sha256"
          cat > "$dest/archive-integrity.md" <<'EOF'
          # C22 source-pinned truly new 45-goal, 141-world native paid self-edit ROI
          
          - Original tested SHA: 3fec55f901b418b81ed06f08c234a78724024977
          - Original successful native + independent Python run: https://github.com/iFrankStudio/cioc/actions/runs/45156358171
          - Git-preserved original artifact SHA256: ef44677809546195960772e7d7dadc093d0a0cf28d2d1adacd35995f93d8a150
          - Complete original 141 JSONL traces, Rust log, result JSON, independent per-paid-CIL replayer JSON and provenance.
          - Same initial frozen F6 code with all PatchNext physical effects on/off; F5 is different source, not single-factor control.
          - All 45 new tasks correct, 0/45 full-cost ROI wins, 45/45 losses, -26569 CIL vs identical-F6 suppressed; B3/B4 NOT_MET.
          EOF
          git add "$dest"
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'evidence(cl1b): archive C22 original native 141-world negative self-edit ROI ZIP'
            for attempt in 1 2 3 4 5; do
              if git push origin HEAD:cl1b-ci-evidence; then break; fi
              if [ "$attempt" = 5 ]; then echo 'evidence push exhausted retries' >&2; exit 1; fi
              git -c protocol.version=2 fetch --depth=1 --filter=blob:none origin cl1b-ci-evidence
              git rebase FETCH_HEAD
            done
          else
            echo 'Identical C22 original archive already present'
          fi
      - name: Fetch Git archive back from remote and reverify original complete binary SHA256
        shell: bash
        run: |
          set -euo pipefail
          git -c protocol.version=2 fetch --depth=1 --filter=blob:none origin cl1b-ci-evidence
          dest='run-records/3fec55f901b418b81ed06f08c234a78724024977-45156358171-1'
          actual="$(git show "FETCH_HEAD:$dest/original-native-artifact.zip" | sha256sum | cut -d' ' -f1)"
          test "$actual" = 'ef44677809546195960772e7d7dadc093d0a0cf28d2d1adacd35995f93d8a150'
          git show "FETCH_HEAD:$dest/original-native-artifact.sha256" | grep -F 'ef44677809546195960772e7d7dadc093d0a0cf28d2d1adacd35995f93d8a150'
          echo 'PASS: C22 source-pinned original evidence survived exact remote Git ZIP readback and SHA256 verification'
