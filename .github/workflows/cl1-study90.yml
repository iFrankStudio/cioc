name: CL-1 Study90 zero-genome reachable native edit path calibration

on:
  push:
    paths:
      - 'cl0/crates/world/tests/study90_reachable_native_detour.rs'
      - 'cl1/studies/90-phase0-reachable-native-code-detour-calibration.md'
      - '.github/workflows/cl1-study90.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  reachable-detour:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: cl0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check human-scripted, zero-genome protocol
        run: |
          set -euo pipefail
          test -s ../cl1/studies/90-phase0-reachable-native-code-detour-calibration.md
      - name: Confirm actor-native edit is reachable after functional injury, compared to mutation-disabled and host controls
        run: |
          set -euo pipefail
          cargo test --locked -p cl0-world --test study90_reachable_native_detour -- --nocapture
      - name: Post source-revision-specific Stage90 calibration CI result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_CONCLUSION: ${{ job.status }}
        run: |
          set -euo pipefail
          if [ "$JOB_CONCLUSION" = success ]; then state=success; else state=failure; fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context="cl1/study90-reachable-native-detour" \
            -f description="Zero new stochastic genotypes; native reachable edit mechanism: $state" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
