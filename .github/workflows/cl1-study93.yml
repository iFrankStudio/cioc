name: CL-1 Study93 native writer-bypass repair reachability calibration

on:
  push:
    paths:
      - 'cl0/crates/world/tests/study93_writer_bypass_repair_reachable.rs'
      - 'cl1/studies/93-phase0-native-writer-bypass-repair-mechanism.md'
      - '.github/workflows/cl1-study93.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  native-writer-bypass:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: cl0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify explicit zero-genome writer-bypass mechanism protocol
        run: |
          set -euo pipefail
          test -s ../cl1/studies/93-phase0-native-writer-bypass-repair-mechanism.md
      - name: Execute focused native CIL lesion, actual writer loss, reachability and host/edit-disabled tests
        run: |
          set -euo pipefail
          cargo test --locked -p cl0-world --test study93_writer_bypass_repair_reachable -- --nocapture
      - name: Publish exact-source CI conclusion for scripted mechanism only
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_CONCLUSION: ${{ job.status }}
        run: |
          set -euo pipefail
          if [ "$JOB_CONCLUSION" = success ]; then state=success; else state=failure; fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context="cl1/study93-scripted-writer-bypass" \
            -f description="Zero-new-genome source-writer bypass with native edit reachability: $state" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
