name: CL-1B preserve C24 original 186-world paid service proxy self-edit experiment
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cl1b-c24-preserve-original-evidence.yml'
  workflow_dispatch:
permissions:
  actions: read
  contents: write
concurrency:
  group: cl1b-c24-original-evidence
  cancel-in-progress: false
jobs:
  verify-and-preserve-original-native-C24:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
      - name: Retrieve byte-exact successful original C24 ZIP and confirm paid CIL evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/cl1b-c24
          curl --fail --location --retry 3 --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/iFrankStudio/cioc/actions/artifacts/14814047858/zip" \
            -o /tmp/cl1b-c24/original-native.zip
          echo '7d6ad6711c9fd780bf93dabac1ba0be2b9e6119ae0a4a116e461ba7520c7d3a9  /tmp/cl1b-c24/original-native.zip' | sha256sum -c -
          python3 - <<'PY'
          import json,zipfile,collections
          path='/tmp/cl1b-c24/original-native.zip'
          with zipfile.ZipFile(path) as z:
              names=z.namelist()
              assert z.testzip() is None and len(names)==len(set(names))==190
              assert sum(n.endswith('.jsonl') for n in names)==186
              s=json.loads(z.read('cl1b_c24_original_native_186_worlds.json'))
              p=json.loads(z.read('cl1b_c24_independent_paid_replay.json'))
              study='CL1B-C24-F8-PAID-CUMULATIVE-SERVICE-PROXY-EDIT-GATE'
              assert s['study']==p['study']==study
              assert s['level']=='ORIGINAL_NATIVE_C24_186_WORLD_PID_PAID_SERVICE_COUNTER_GATE'
              assert s['source_sha']==p['original_native_sha']=='22c800a4c80362e48963366b83821a174b2be5d9'
              assert s['counts']['worlds']==p['original_native_worlds_exactly_replayed']==186
              assert s['counts']['truthful_worlds']==180 and s['counts']['adversarial']==6
              assert s['counts']['total_original_paid_instructions']==p['original_charged_CIL_instruction_count_exactly_replayed']
              assert p['first_divergence'] is None and len(s['records'])==45 and len(s['controls'])==6
              assert len(p['same_source_first_true_physical_patchnext_effect'])==45
              assert p['arm_fees']=={'f8_on':80625,'f8_off':71700,'f6_original':86240,'f5_original':77096}
              assert p['arm_true_matched_stages']=={'f8_on':1080,'f8_off':1080,'f6_original':1080,'f5_original':1080}
              gate=p['actor_paid_service_count_gate_evidence']
              assert gate=={'charged_counter_increments':1913,'charged_counter_reads_before_increment':1913,
                'charged_attempt_reads_before_first_edit':45,'gate_allow_attempt_2':9,
                'gate_allow_attempt_3':4,'gate_skip_all_other_attempt_counts':32,
                'paid_original_PC82_patchnext_executions':13}
              assert p['same_source_paid_savings_sum']==-8925
              assert p['F8_on_minus_original_F6_paid']==-5615
              assert p['F8_on_minus_original_F5_paid']==3529
              assert all(r['f8_on']['truthful_matches']==r['f8_off']['truthful_matches']==r['f6_original']['truthful_matches']==r['f5_original']['truthful_matches']==24 for r in s['records'])
              for row in s['records']:
                  on=row['f8_on']
                  assert len(on['paid_attempt_reads'])==1
                  assert len(on['paid_counter_writes'])==len(on['paid_counter_reads'])==len(on['services'])
                  assert [e['value'] for e in on['paid_counter_writes']]==list(range(1,len(on['services'])+1))
              text=z.read('cl1b-c24-original-provenance.txt').decode()
              assert 'tested_sha=22c800a4c80362e48963366b83821a174b2be5d9' in text
              assert 'run_id=45165695178' in text
              assert 'cohort=45_FULLY_NEW_24_GOAL_SCHEDULES_VS_P4F6_C22_C23' in text
              seen=collections.Counter(row['f8_on']['paid_attempt_reads'][0]['attempts'] for row in s['records'])
              print('PASS C24 186 original worlds, true paid 1913 CIL Write40 and independent original 186-world full CIL evidence. B3/B4 NOT_MET')
              print('C24 ACTUAL ORIGINAL PAID SERVICE ATTEMPTS AT EDIT GATE:',dict(sorted(seen.items())))
          PY
      - name: Preserve exact original C24 ZIP bytes in Git evidence branch
        shell: bash
        run: |
          set -euo pipefail
          git -c protocol.version=2 fetch --depth=1 --filter=blob:none origin cl1b-ci-evidence
          dest='run-records/22c800a4c80362e48963366b83821a174b2be5d9-45165695178-1'
          git sparse-checkout init --cone
          git sparse-checkout set "$dest"
          git checkout -B cl1b-ci-evidence FETCH_HEAD
          mkdir -p "$dest"
          cp /tmp/cl1b-c24/original-native.zip "$dest/original-native-artifact.zip"
          echo '7d6ad6711c9fd780bf93dabac1ba0be2b9e6119ae0a4a116e461ba7520c7d3a9  original-native-artifact.zip' > "$dest/original-native-artifact.sha256"
          cat > "$dest/archive-integrity.md" <<'EOF'
          # C24 exact original 186 native worlds, paid CIL cumulative service count gate
          - Original tested SHA: 22c800a4c80362e48963366b83821a174b2be5d9
          - Verified original native Rust + independent exact full paid CIL: https://github.com/iFrankStudio/cioc/actions/runs/45165695178
          - Original artifact ZIP SHA256: 7d6ad6711c9fd780bf93dabac1ba0be2b9e6119ae0a4a116e461ba7520c7d3a9
          - 186 full native original JSONL, native summary, Rust stdout, 186-world independent Python ordinary paid CIL replay, source provenance.
          - 45 new 24-stage goal schedules; four arms, six deceptive-feedback negatives; every truthful stage completed.
          - F8 PID1 itself charges 1913 service Write40 increments; first Edit gate executes 13 paid PC82 edits and skips 32/45.
          - F8 lifetime 80625 paid CIL vs different-source original F6 86240, saving 5615; but same F8 source PatchNext physically suppressed 71700, still 8925 cheaper. No self-invented ROI, B3/B4 NOT_MET.
          EOF
          git add "$dest"
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'evidence(cl1b): preserve C24 original 186 paid CIL service-counter worlds'
            for attempt in 1 2 3 4 5; do
              if git push origin HEAD:cl1b-ci-evidence; then break; fi
              if [ "$attempt" = 5 ]; then echo 'C24 archive push exhausted retries' >&2; exit 1; fi
              git -c protocol.version=2 fetch --depth=1 --filter=blob:none origin cl1b-ci-evidence
              git rebase FETCH_HEAD
            done
          else
            echo 'C24 original ZIP already archived'
          fi
      - name: Fetch archived original ZIP from remote Git and rehash exact bytes
        shell: bash
        run: |
          set -euo pipefail
          git -c protocol.version=2 fetch --depth=1 --filter=blob:none origin cl1b-ci-evidence
          dest='run-records/22c800a4c80362e48963366b83821a174b2be5d9-45165695178-1'
          got="$(git show "FETCH_HEAD:$dest/original-native-artifact.zip" | sha256sum | cut -d' ' -f1)"
          test "$got" = '7d6ad6711c9fd780bf93dabac1ba0be2b9e6119ae0a4a116e461ba7520c7d3a9'
          git show "FETCH_HEAD:$dest/original-native-artifact.sha256" | grep -F '7d6ad6711c9fd780bf93dabac1ba0be2b9e6119ae0a4a116e461ba7520c7d3a9'
          echo 'PASS C24 original 186-world ZIP permanently Git-preserved, byte-identical after remote re-read'
