name: CL-1B C19R2 original paid-PC cost anatomy 90 truthful native cases
on:
  push:
    branches: [main]
    paths:
      - 'cl1b/audits/cl1b_c19r2_original_paid_pc_cost_anatomy.py'
      - '.github/workflows/cl1b-c19r2-original-paid-pc-cost-anatomy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-548-world-paid-instruction-cost-profiling:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Recover complete native ZIP artifacts from permanent Git evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cl1b-c19r2
          git -c protocol.version=2 fetch --depth=1 --filter=blob:none origin cl1b-ci-evidence
          a='run-records/8d2cf7f71ef744b50e59b11ea9a5a75130ff510b-45127112522-1/original-native-artifact.zip'
          b='run-records/ce8a6fdc15711a1645756a1fe871bbde3bd9928b-45127120747-1/original-native-artifact.zip'
          git cat-file -e "FETCH_HEAD:$a"
          git cat-file -e "FETCH_HEAD:$b"
          git show "FETCH_HEAD:$a" > /tmp/cl1b-c19r2/a.zip
          git show "FETCH_HEAD:$b" > /tmp/cl1b-c19r2/b.zip
          echo '4e0eea03df3a6009a94b972539184d96cd76450974f8a1777aff76e2b5ee568b  /tmp/cl1b-c19r2/a.zip' | sha256sum -c -
          echo '04037a8fefc9e59c22986d32aa944814dbc596480576addc8cbaf86c7c25c363  /tmp/cl1b-c19r2/b.zip' | sha256sum -c -
      - name: Reaudit all 548 worlds and count each paid instruction in 270 complete original truthful traces
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cl1b-ci-evidence
          python3 cl1b/audits/cl1b_c19r2_original_paid_pc_cost_anatomy.py \
            /tmp/cl1b-c19r2/a.zip /tmp/cl1b-c19r2/b.zip \
            cl1b-ci-evidence/cl1b_c19r2_original_paid_pc_cost_anatomy.json \
            | tee cl1b-ci-evidence/cl1b-c19r2-audit.log
          python3 - <<'PY'
          import json
          d=json.load(open('cl1b-ci-evidence/cl1b_c19r2_original_paid_pc_cost_anatomy.json'))
          assert d['total_main_paid_CIL']==399252
          assert d['total_C9_paid_CIL']==309125
          assert d['total_main_excess_vs_C9']==90127
          assert d['total_main_excess_vs_C9']==d['total_main_appended_PC180_240']+d['total_main_base_PC000_179_minus_C9_base_PC000_179']
          for name in ('known_not_heldout','prospective_heldout'):
            c=d[name]
            assert len(c['cases'])==45
            assert c['original_native_worlds_independently_reverified']==274
            assert sum(x['main_CIL'] for x in c['cases'])==c['charged_main_CIL']
            assert sum(x['same_source_PC225_suppressed_CIL'] for x in c['cases'])==c['charged_same_source_PC225_suppressed_CIL']
            assert sum(x['different_source_C9_CIL'] for x in c['cases'])==c['charged_different_source_C9_CIL']
          print('PASS: exact paid PC histograms across original 270 complete truth-source trajectories; B3/B4 NOT_MET')
          PY
      - name: Keep exact provenance and machine-readable all-case decomposition
        if: always()
        shell: bash
        run: |
          mkdir -p cl1b-ci-evidence
          {
            echo "audit_revision=$GITHUB_SHA"
            echo "audit_run=$GITHUB_RUN_ID"
            echo "C19a_tested_sha=8d2cf7f71ef744b50e59b11ea9a5a75130ff510b"
            echo "C19b_tested_sha=ce8a6fdc15711a1645756a1fe871bbde3bd9928b"
            echo "scope=RETROSPECTIVE_PAID_PC_PROFILING_NOT_NEW_NATIVE_WORLDS"
          } > cl1b-ci-evidence/cl1b-c19r2-provenance.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cl1b-c19r2-original-native-paid-pc-cost-anatomy
          path: cl1b-ci-evidence/
          if-no-files-found: warn
