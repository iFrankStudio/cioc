name: CL-1B C30 R3 frozen compiled entry native
on:
  push:
    branches: [main]
    paths:
      - 'cl0/crates/world/tests/cl1b_c30_r3_compiled_entry_native.rs'
      - 'cl1b/studies/CL1B-C30-R3-COMPILED-ENTRY-frozen-51-worlds-v1.json'
      - 'cl1b/audits/cl1b_c30_r3_compiled_entry_replay.py'
      - '.github/workflows/cl1b-c30-r3-compiled-entry-native.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-and-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cl0
      - name: Execute frozen native worlds
        working-directory: cl0
        run: |
          set -euo pipefail
          mkdir -p cl1b-c30-r3-evidence
          cargo test --locked -p cl0-world --test cl1b_c30_r3_compiled_entry_native -- --nocapture 2>&1 | tee cl1b-c30-r3-evidence/native.log
      - name: Independent paid dynamic-source replay and matched causal prefix
        run: |
          set -euo pipefail
          python3 cl1b/audits/cl1b_c30_r3_compiled_entry_replay.py cl1b/studies/CL1B-C30-R3-COMPILED-ENTRY-frozen-51-worlds-v1.json cl0/cl1b-c30-r3-evidence > cl0/cl1b-c30-r3-evidence/replay.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cl1b-c30-r3-frozen-51-worlds-native
          path: cl0/cl1b-c30-r3-evidence/
          if-no-files-found: warn
