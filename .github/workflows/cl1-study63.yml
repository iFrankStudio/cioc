name: CL-1 Study63 scripted feedback and native resource feasibility

on:
  push:
    paths:
      - 'cl0/crates/lab/src/bin/cl1-study63.rs'
      - 'cl1/analyze_study63.py'
      - '.github/workflows/cl1-study63.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  feedback-mechanism:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: cl0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Study63 frozen calibration registration
        run: |
          test -s ../cl1/studies/63-preregistered-native-feedback-resource-feasibility.md
      - name: Rust format, focused workspace tests and strict Clippy
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo test --locked --workspace
          cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Run exactly six scripted feedback and compute-access mechanisms, exact deterministic replay
        run: |
          set -euo pipefail
          CL1_SOURCE_REVISION="$GITHUB_SHA" cargo run --locked --quiet -p cl0-lab --bin cl1-study63 -- "$RUNNER_TEMP/cl1-study63-feedback-calibration.sqlite"
      - name: Independently audit all 48 original SHA256 epochs and causal native I/O/output and energy provenance
        run: |
          set -euo pipefail
          python3 ../cl1/analyze_study63.py "$RUNNER_TEMP/cl1-study63-feedback-calibration.sqlite" --expected-revision "$GITHUB_SHA" --json "$RUNNER_TEMP/cl1-study63-report.json"
      - name: Archive original scripted lab SQLite and independent causality report (zero ecology worlds)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cl1-study63-scripted-feedback-energy-calibration
          retention-days: 30
          path: |
            ${{ runner.temp }}/cl1-study63-feedback-calibration.sqlite
            ${{ runner.temp }}/cl1-study63-report.json
