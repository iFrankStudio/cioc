name: CL-1 Study87 retrospective original E11 source assay diagnosis

on:
  push:
    paths:
      - 'cl1/studies/87-registered-retrospective-early-functional-exposure-loss.md'
      - 'cl1/analyze_study87.py'
      - '.github/workflows/cl1-study87.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  statuses: write

jobs:
  original-source-assay-exposure:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: cl0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check registered post-outcome diagnostic and original source-independent audit
        run: |
          set -euo pipefail
          test -s ../cl1/studies/87-registered-retrospective-early-functional-exposure-loss.md
          test -s ../cl1/analyze_study86.py
      - name: Download exactly the original verified Study86 native 128-genotype 1536-run corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/study87"
          gh run download 43595688472 --repo "$GITHUB_REPOSITORY" --name cl1-study86-original-native-functional-lesion --dir "$RUNNER_TEMP/study87"
          test -s "$RUNNER_TEMP/study87/cl1-study86-original-prefork-native-lesions.sqlite"
      - name: Reaudit original 27648 source-pinned epoch hashes and identify causal exposure failure mode
        run: |
          set -euo pipefail
          python3 ../cl1/analyze_study87.py "$RUNNER_TEMP/study87/cl1-study86-original-prefork-native-lesions.sqlite" --json "$RUNNER_TEMP/study87-native-exposure-diagnosis.json"
      - name: Archive only retrospective source-PC diagnostic JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cl1-study87-retrospective-source-early-exposure
          retention-days: 30
          path: ${{ runner.temp }}/study87-native-exposure-diagnosis.json
      - name: Report verified retrospective Study87 source status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_CONCLUSION: ${{ job.status }}
        run: |
          set -euo pipefail
          if [ "$JOB_CONCLUSION" = success ]; then state=success; else state=failure; fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context="cl1/study87-retrospective-source-exposure" \
            -f description="Source-pinned original 1536 runs and all 27648 original hashes: $state" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
