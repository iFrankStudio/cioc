name: CL-1 Study35 prospective source-address replication

on:
  push:
    paths:
      - 'cl0/crates/lab/src/bin/cl1-study35.rs'
      - 'cl1/analyze_study35.py'
      - 'cl1/tests/test_study35.py'
      - '.github/workflows/cl1-study35.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  study35:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: cl0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enforce prospectively frozen independent Study35 registration
        run: |
          test -f ../cl1/studies/35-preregistered-independent-native-source-address-shift.md
      - name: Compile, run registered grammar controls and strictly lint native code
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo test --locked --workspace
          cargo clippy --locked --workspace --all-targets -- -D warnings
          python3 -m unittest discover -s ../cl1/tests -v
      - name: Execute 192 fresh seed worlds and 1728 full native SQLite replays
        run: |
          set -euo pipefail
          CL1_SOURCE_REVISION="$GITHUB_SHA" cargo run --locked --quiet -p cl0-lab --bin cl1-study35 -- "$RUNNER_TEMP/cl1-study35.sqlite"
      - name: Independent 41472-hash audit and prospectively frozen paired source address shifts
        run: |
          set -euo pipefail
          python3 ../cl1/analyze_study35.py "$RUNNER_TEMP/cl1-study35.sqlite" --json "$RUNNER_TEMP/cl1-study35-report.json"
          cat "$RUNNER_TEMP/cl1-study35-report.json" | python3 -c 'import json,sys; r=json.load(sys.stdin); print(json.dumps({"study":r["study"],"primary":r["primary_paired_native_source_address_shift"],"source_revision":r["source_revision"],"life_claim":r["life_claim"]},indent=2))'
      - name: Preserve untouched new-seed SQLite ecology and independent report
        uses: actions/upload-artifact@v4
        with:
          name: cl1-study35-independent-prospective
          retention-days: 30
          path: |
            ${{ runner.temp }}/cl1-study35.sqlite
            ${{ runner.temp }}/cl1-study35-report.json
