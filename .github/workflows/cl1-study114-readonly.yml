name: CL-1 Study114 original 256-world read-only repair-aware audit

on:
  push:
    paths:
      - 'cl1/analyze_study114.py'
      - '.github/workflows/cl1-study114-readonly.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  original-code-ancestry:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reopen original frozen Study114 artifact without regenerating code or worlds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -s cl1/studies/114-preregistered-dormant-code-buffer-native-mutational-robustness.md
          mkdir -p "$RUNNER_TEMP/study114-original"
          gh run download 43612895938 --repo "$GITHUB_REPOSITORY" --name cl1-study114-full-native-neutral-buffer --dir "$RUNNER_TEMP/study114-original"
          test -s "$RUNNER_TEMP/study114-original/study114-original-native-dormant-buffer.sqlite"
      - name: Reconstruct ALL original incomplete and complete child code graphs, edits, full snapshots
        run: |
          set -euo pipefail
          python3 cl1/analyze_study114.py "$RUNNER_TEMP/study114-original/study114-original-native-dormant-buffer.sqlite" --expected-revision dd0a1ee78765fbdcdf625ac08069198625d0f84b --json "$RUNNER_TEMP/study114-readonly-original-ancestry.json"
      - name: Archive source-frozen original-only independent audit
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cl1-study114-original-256world-readonly-ancestry
          retention-days: 30
          path: ${{ runner.temp }}/study114-readonly-original-ancestry.json
