name: CL-1B C33 R1 frozen subprogram reuse native
on:
  push:
    branches: [main]
    paths:
      - 'cl0/crates/world/tests/cl1b_c33_r1_native_reuse.rs'
      - 'cl1b/studies/CL1B-C33-R1-NATIVE-REUSE-frozen-82-worlds-v1.json'
      - 'cl1b/audits/cl1b_c33_r1_native_reuse_replay.py'
      - '.github/workflows/cl1b-c33-r1-native-reuse.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-and-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cl0
      - name: Execute frozen native worlds
        working-directory: cl0
        run: |
          set -euo pipefail
          mkdir -p cl1b-c33-r1-evidence
          cargo test --locked -p cl0-world --test cl1b_c33_r1_native_reuse -- --nocapture 2>&1 | tee cl1b-c33-r1-evidence/native.log
      - name: Independent paid dynamic-source replay and matched causal prefix
        run: |
          set -euo pipefail
          python3 cl1b/audits/cl1b_c33_r1_native_reuse_replay.py cl1b/studies/CL1B-C33-R1-NATIVE-REUSE-frozen-82-worlds-v1.json cl0/cl1b-c33-r1-evidence > cl0/cl1b-c33-r1-evidence/replay.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cl1b-c33-r1-frozen-82-worlds-native
          path: cl0/cl1b-c33-r1-evidence/
          if-no-files-found: warn
