name: CL-1 Study97 original random native functional child payload inheritance under scripted assembler

on:
  push:
    paths:
      - 'cl0/crates/lab/src/bin/cl1-study97.rs'
      - 'cl1/analyze_study97.py'
      - 'cl1/studies/97-preregistered-stochastic-native-child-payload-conditional-assembly.md'
      - '.github/workflows/cl1-study97.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  original-random-child-payload:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: cl0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify prospective frozen sampled-payload protocol and original generic native assembler mechanics
        run: |
          set -euo pipefail
          test -s ../cl1/studies/97-preregistered-stochastic-native-child-payload-conditional-assembly.md
          cargo test --locked -p cl0-world --test study96_functional_native_child_assembly
      - name: Execute original 256 fresh payloads and all 1536 matched source/mode native child worlds
        run: |
          set -euo pipefail
          CL1_SOURCE_REVISION="$GITHUB_SHA" cargo run --locked --quiet -p cl0-lab --bin cl1-study97 -- "$RUNNER_TEMP/cl1-study97-native-random-child-payloads.sqlite"
      - name: Independently regenerate random payloads and validate 18432 original SHA256 epochs, native function ancestry and controls
        run: |
          set -euo pipefail
          python3 ../cl1/analyze_study97.py "$RUNNER_TEMP/cl1-study97-native-random-child-payloads.sqlite" --expected-revision "$GITHUB_SHA" --json "$RUNNER_TEMP/cl1-study97-independent-functional-child-audit.json"
      - name: Archive original source-pinned native child SQLite and independent audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cl1-study97-original-random-child-payloads
          retention-days: 30
          path: |
            ${{ runner.temp }}/cl1-study97-native-random-child-payloads.sqlite
            ${{ runner.temp }}/cl1-study97-independent-functional-child-audit.json
      - name: Post exact-source validated Study97 original ecological outcome
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_CONCLUSION: ${{ job.status }}
        run: |
          set -euo pipefail
          if [ "$JOB_CONCLUSION" = success ]; then state=success; else state=failure; fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context="cl1/study97-random-functional-child" \
            -f description="256 random payloads, scripted assembler, native child ancestry: $state" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
