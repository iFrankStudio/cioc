[package]
name = "cl0-lab"
version = "0.1.0"
edition = "2021"
description = "Causal experiment registry and deterministic replay for CL-0"
license = "MIT"

[dependencies]
cl0-world = { path = "../world" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[lib]
name = "cl0_lab"
path = "src/lib.rs"

[[bin]]
name = "cl0-lab"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3"
