[package]
name = "cl0-world"
version = "0.1.0"
edition = "2021"
description = "Deterministic resource-bounded native digital world, not a life simulator"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }

[lib]
name = "cl0_world"
path = "src/lib.rs"

[[bin]]
name = "cl0-world"
path = "src/main.rs"

[dev-dependencies]
serde_json = "1"
